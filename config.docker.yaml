onlyoffice:
  enabled: true
  # URL to OnlyOffice api.js loaded by browser (external/host URL)
  api_js_url: "http://localhost:8088/web-apps/apps/api/documents/api.js"
  jwt_secret: "dev-only-jwt-secret-change-in-production"  # Must match ONLYOFFICE_JWT_SECRET in .env
  verify_certificate: false
  # URL for OnlyOffice container to reach SesameFS (docker network)
  server_url: "http://sesamefs:8080"
  # URL for SesameFS to reach OnlyOffice internally (docker network, port 80 not 8088)
  internal_url: "http://onlyoffice:80"
  # Extensions that can be viewed in OnlyOffice
  view_extensions:
    - doc
    - docx
    - ppt
    - pptx
    - xls
    - xlsx
    - odt
    - fodt
    - odp
    - fodp
    - ods
    - fods
  # Extensions that can be edited (subset of view)
  edit_extensions:
    - docx
    - pptx
    - xlsx
