onlyoffice:
  enabled: false
  api_js_url: ""
  jwt_secret: ""
  jwt_ttl_seconds: 3600
  max_document_bytes: 524288000
  verify_certificate: false
  force_save: true
  # Optional explicit SesameFS URL for OnlyOffice document fetches.
  # Leave empty to derive it from the current request host.
  server_url: ""
  # Optional explicit OnlyOffice URL for callback downloads.
  # Leave empty to reuse the host from api_js_url.
  internal_url: ""
  view_extensions:
    - doc
    - docx
    - ppt
    - pptx
    - xls
    - xlsx
    - odt
    - fodt
    - odp
    - fodp
    - ods
    - fods
    - pdf
  edit_extensions:
    - docx
    - pptx
    - xlsx

download_admission:
  # D6 measured operating values. Budget: 2 GiB per node.
  #   plaintext stream  4.0 MiB/admission   encrypted stream 36 MiB @8 / 72 MiB @16
  #   raw iWork @32 MiB source ~192 MiB/admission (buffers the whole document)
  # Worst case under these caps: 6*192 MiB + 12*72 MiB = 2016 MiB (~1.97 GiB).
  # Process-local: fleet capacity scales with node count, this is not a cluster quota.
  enabled: true
  memory_budget_bytes: 2147483648 # 2 GiB; set to about 25% of this container's memory limit
  max_active_per_node: 18
  max_active_per_auth_user: 6
  max_active_per_link_source: 6
  max_active_per_client_link: 3
  max_waiters_per_identity: 4
  max_waiters_per_node: 24
  admission_wait: 2s
  preparation_deadline: 60s
  idle_write_timeout: 60s
  retry_after: 10s
  max_active_block: 16
  max_active_file: 16
  max_active_raw: 6
  max_active_history: 6
  max_active_link_raw: 12
  max_active_zip: 4
  max_active_link_inline: 8

enforcement_profiles:
  hard:
    features:
      can_add_repo: true
      can_share_repo: true
      can_add_group: false
      can_generate_share_link: true
      can_generate_upload_link: true
      can_send_share_link_mail: false
      can_publish_repo: false
      can_use_global_address_book: false
      can_connect_with_desktop_clients: true
      can_connect_with_android_clients: true
      can_connect_with_ios_clients: true
      can_export_files_via_mobile_client: true
    limits:
      max_libraries: 3
      max_share_links: 3
      max_upload_links: 1
      share_link_expire_days_max: 3
      upload_link_expire_days_max: 3

  soft:
    features:
      can_add_repo: true
      can_share_repo: true
      can_add_group: true
      can_generate_share_link: true
      can_generate_upload_link: true
      can_send_share_link_mail: true
      can_publish_repo: true
      can_use_global_address_book: true
      can_connect_with_desktop_clients: true
      can_connect_with_android_clients: true
      can_connect_with_ios_clients: true
      can_export_files_via_mobile_client: true
    limits:
      max_libraries: -1
      max_share_links: -1
      max_upload_links: -1
      share_link_expire_days_max: 0
      upload_link_expire_days_max: 0
