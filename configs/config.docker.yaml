onlyoffice:
  enabled: true
  # Docker dev now matches production semantics: SesameFS only needs the
  # browser-facing api_js_url plus the shared JWT secret. When api_js_url is a
  # loopback address, the backend auto-detects the internal compose service
  # URLs for callback and save traffic.
  api_js_url: "http://localhost:8088/web-apps/apps/api/documents/api.js"
  jwt_secret: ""                     # Set via ONLYOFFICE_JWT_SECRET env var (required when enabled)
  jwt_ttl_seconds: 3600              # Override via ONLYOFFICE_JWT_TTL_SECONDS (default 1 hour)
  max_document_bytes: 524288000      # Reject callback downloads larger than 500 MiB
  verify_certificate: false
  force_save: true
  server_url: ""                     # Optional explicit override; leave empty for auto-detection
  internal_url: ""                   # Optional explicit override; leave empty for auto-detection
  # Extensions that can be viewed in OnlyOffice
  view_extensions:
    - doc
    - docx
    - ppt
    - pptx
    - xls
    - xlsx
    - odt
    - fodt
    - odp
    - fodp
    - ods
    - fods
    - pdf
  # Extensions that can be edited (subset of view)
  edit_extensions:
    - docx
    - pptx
    - xlsx

enforcement_profiles:
  hard:
    features:
      can_add_repo: true
      can_share_repo: true
      can_add_group: false
      can_generate_share_link: true
      can_generate_upload_link: true
      can_send_share_link_mail: false
      can_publish_repo: false
      can_use_global_address_book: false
      can_connect_with_desktop_clients: true
      can_connect_with_android_clients: true
      can_connect_with_ios_clients: true
      can_export_files_via_mobile_client: true
    limits:
      max_libraries: 3
      max_share_links: 3
      max_upload_links: 1
      share_link_expire_days_max: 3
      upload_link_expire_days_max: 3

  soft:
    features:
      can_add_repo: true
      can_share_repo: true
      can_add_group: true
      can_generate_share_link: true
      can_generate_upload_link: true
      can_send_share_link_mail: true
      can_publish_repo: true
      can_use_global_address_book: true
      can_connect_with_desktop_clients: true
      can_connect_with_android_clients: true
      can_connect_with_ios_clients: true
      can_export_files_via_mobile_client: true
    limits:
      max_libraries: -1
      max_share_links: -1
      max_upload_links: -1
      share_link_expire_days_max: 0
      upload_link_expire_days_max: 0
