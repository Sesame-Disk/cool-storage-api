# SesameFS Configuration
# Copy this file to config.yaml and customize for your environment.
# Runtime load order is:
#   1. internal/config.DefaultConfig() code defaults
#   2. YAML from CONFIG_PATH (typically this file copied to config.yaml)
#   3. Environment variable overrides via applyEnvOverrides()
# Keys omitted here keep the code defaults.

server:
  port: ":8080"
  read_timeout: 0s         # No full-body read timeout — large uploads can take minutes
  read_header_timeout: 10s # Timeout for reading request headers only (Slowloris protection)
  write_timeout: 0s        # No write timeout — large downloads/zips can take minutes
  max_upload_mb: 10240     # 10240 MB (~10 GiB) max upload size
  trusted_proxies: []      # Secure default: trust no forwarded client IP headers; set exact reverse-proxy IP/CIDRs in prod
  url: ""                 # Optional explicit public base URL; usually override via SERVER_URL when proxy autodetection is insufficient
  desktop_custom_brand: "" # Optional desktop-client brand label; can also be set via DESKTOP_CUSTOM_BRAND
  desktop_custom_logo: "" # Optional desktop-client logo URL; can also be set via DESKTOP_CUSTOM_LOGO
  mobile_frontend_path: "./mobile-frontend/dist" # Built mobile frontend directory

database:
  hosts:
    - localhost:9042
  keyspace: sesamefs
  consistency: LOCAL_QUORUM
  local_dc: datacenter1
  replication_class: NetworkTopologyStrategy
  replication_dcs:
    datacenter1: 1
  # username: cassandra
  # password: cassandra
  # replication env overrides: CASSANDRA_REPLICATION_CLASS, CASSANDRA_REPLICATION_DCS
  # legacy-only fallback: CASSANDRA_REPLICATION_FACTOR when using SimpleStrategy

storage:
  default_class: hot-s3-usa

  # Storage classes: {tier}-{type}-{region}
  # Each class is a named storage backend with location info
  classes:
    # Hot storage (immediate access) - Multi-region
    hot-s3-usa:
      type: s3
      tier: hot
      endpoint: ""                    # Leave empty for AWS
      bucket: sesamefs-usa
      region: us-east-1
      server_side_encryption: "AES256" # Recommended default for AWS S3
      sse_kms_key_id: ""               # Optional; set only when using aws:kms
      failover_class: hot-s3-eu       # Failover if this backend is down

    hot-s3-eu:
      type: s3
      tier: hot
      endpoint: ""
      bucket: sesamefs-eu
      region: eu-west-1
      server_side_encryption: "AES256"
      sse_kms_key_id: ""
      failover_class: hot-s3-usa

    hot-s3-china:
      type: s3
      tier: hot
      endpoint: ""
      bucket: sesamefs-china
      region: cn-north-1
      server_side_encryption: "AES256"
      sse_kms_key_id: ""

    # Cold storage (delayed access)
    cold-glacier-usa:
      type: glacier
      tier: cold
      bucket: sesamefs-archive-usa
      region: us-east-1

    # Local development (MinIO)
    hot-minio-local:
      type: s3
      tier: hot
      endpoint: "http://localhost:9000"
      bucket: sesamefs-blocks
      region: us-east-1
      server_side_encryption: ""       # Optional; leave empty unless your local S3 backend supports SSE
      sse_kms_key_id: ""
      use_path_style: true            # Required for MinIO
      # credentials → provide via S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY env vars

  # Map API hostnames to regions
  endpoint_regions:
    "us.sesamefs.com": "usa"
    "eu.sesamefs.com": "eu"
    "cn.sesamefs.com": "china"
    "*.sesamefs.com": "usa"           # Wildcard default
    "localhost": "local"
    "*": "usa"                        # Global default

  # Map regions to storage classes
  region_classes:
    usa:
      hot: hot-s3-usa
      cold: cold-glacier-usa
    eu:
      hot: hot-s3-eu
      cold: cold-glacier-usa          # Uses USA cold storage
    china:
      hot: hot-s3-china
      cold: ""                        # No cold storage in China yet
    local:
      hot: hot-minio-local
      cold: ""

  # Legacy backends (deprecated, use classes instead)
  # backends:
  #   hot:
  #     type: s3
  #     bucket: sesamefs-blocks-hot

auth:
  dev_mode: false                     # Enable only for local development with explicit test tokens
  dev_tokens: []                      # Define local-only dev tokens in a private config, not in shared examples
  first_superadmin_email: ""         # Optional bootstrap email via FIRST_SUPERADMIN_EMAIL env var

  # HMAC key used to sign password-unlock cookies for password-protected share/upload links.
  # Allows the browser to remember the password for 24 hours without re-prompting.
  # In production: generate with `openssl rand -hex 32` and set via SHARE_LINK_HMAC_KEY env var.
  # sesamefs refuses to start in production if this is empty or set to the insecure default.
  share_link_hmac_key: ""             # Set via SHARE_LINK_HMAC_KEY env var

  oidc:
    enabled: false
    issuer: https://accounts.sesamedisk.com
    client_id: ""                     # Set via OIDC_CLIENT_ID env var
    client_secret: ""                 # Set via OIDC_CLIENT_SECRET env var
    redirect_uris: []                  # Set via OIDC_REDIRECT_URIS env var
    scopes:
      - openid
      - profile
      - email
    org_claim: ""                     # Set via OIDC_ORG_CLAIM when org membership comes from a custom claim
    roles_claim: ""                   # Set via OIDC_ROLES_CLAIM when roles come from a custom claim
    auto_provision: false                # Accounts should provision orgs/users explicitly; opt in only when desired
    default_role: user
    default_org_id: ""                # Optional fallback org UUID via OIDC_DEFAULT_ORG_ID
    default_org_name: ""              # Optional fallback org name via OIDC_DEFAULT_ORG_NAME
    allowed_org_claims: ""            # Optional allowlist via OIDC_ALLOWED_ORG_CLAIMS
    platform_org_id: "00000000-0000-0000-0000-000000000000"
    platform_org_claim_value: ""      # Optional claim value that maps to the platform org
    session_ttl: 24h
    api_token_ttl: 4320h
    refresh_token_ttl: 168h
    jwt_signing_key: ""               # Set via OIDC_JWT_SIGNING_KEY env var
    allow_offline_token: false
    groups_claim: ""                  # Optional group-membership claim
    departments_claim: ""             # Optional department-membership claim
    sync_groups_on_login: false
    sync_departments_on_login: false
    full_sync_groups: false
    full_sync_departments: false
    require_pkce: true
    validate_audience: true
    allowed_clock_skew: 2m

billing:
  # External billing portal URL. The frontend always links to /billing/ inside SesameFS;
  # the backend validates auth and redirects to this external destination.
  # In local Docker compose, BILLING_URL defaults to the Sesame test portal.
  url: ""                           # Override with BILLING_URL env var

accounts:
  # External Accounts URLs used by SesameFS internal redirect routes.
  # Frontend links stay inside SesameFS at /accounts/delete/;
  # the backend validates auth and redirects to these external destinations.
  delete_account_url: ""            # Override with ACCOUNTS_DELETE_ACCOUNT_URL env var
  org_user_management_url: ""       # Optional Accounts org-member base URL; supports {org_id}. SesameFS appends view/action/user_email query params. Override with ACCOUNTS_ORG_USER_MANAGEMENT_URL
  # Default is true: tenant org-admin user writes under /api/v2.1/org/:org_id/admin/... are blocked.
  # Platform superadmins still bypass this tenant lock as an operational fallback, but Accounts should prefer /api/v2.1/admin/.
  disable_org_user_writes: true      # Override with ACCOUNTS_DISABLE_ORG_USER_WRITES env var

organizations:
  # New organizations, OIDC auto-provisioned orgs, and the seeded default org
  # all inherit from this template. Adjust these values here instead of editing code.
  default_template: free
  templates:
    free:
      plan: free
      quota_policy: hard
      billing_cycle: monthly
      storage_quota: 2000000000          # 2 GB (decimal)
      traffic_quota: 10000000000         # 10 GB combined per period (decimal)
      traffic_upload_quota: -1           # any value <= 0 disables the per-direction upload cap
      traffic_download_quota: -1         # any value <= 0 disables the per-direction download cap
      max_users: 1                       # any value <= 0 disables the member cap
      chunking_polynomial: 17592186044415
      settings:
        theme: default
        features: all
      storage_config:
        default_backend: ""             # optional; defaults to storage.default_class when empty

chunking:
  algorithm: fastcdc
  hash_algorithm: sha256

  # Adaptive chunk sizing (adjusts to client network speed)
  # This applies to server-side chunking (web/API uploads)
  # Seafile desktop/mobile clients control their own chunking (256KB-4MB, SHA-1)
  adaptive:
    enabled: true
    absolute_min: 2097152             # 2 MB floor (slow/unstable connections)
    absolute_max: 268435456           # 256 MB ceiling (datacenter speeds)
    initial_size: 16777216            # 16 MB starting point
    target_seconds: 8                 # Target ~8 seconds per chunk upload

  # Speed probe (measures connection before upload)
  probe:
    size: 1048576                     # 1 MB probe size
    timeout: 30s                      # Probe timeout

  # Timeout and retry settings
  retry:
    chunk_timeout: 60s                # Abort chunk after 60 seconds
    max_retries: 5                    # Max retry attempts
    reduce_on_timeout: 0.5            # Reduce to 50% size on timeout
    reduce_on_failure: 0.5            # Reduce to 50% size on failure
    backoff_base: 1s                  # Base backoff duration
    backoff_max_jitter: 500ms         # Max jitter to add

versioning:
  default_ttl_days: 90                # 0 = keep forever
  min_ttl_days: 7
  gc_interval: 24h

seafhttp:
  token_ttl: 24h
  zip_max_entries: 100000            # max files included in a streamed ZIP download
  zip_max_depth: 64                  # max directory nesting when traversing a ZIP download
  zip_max_bytes: 10737418240         # 10 GiB max total uncompressed bytes in a ZIP download

gc:
  enabled: false                   # Safe default; enable explicitly with GC_ENABLED=true on the designated GC replica
  worker_interval: 30s
  scan_interval: 24h
  batch_size: 100
  reconcile_batch_size: 256          # Dirty orgs reconciled per tick (0 = all). Drives gc_stats snapshot freshness vs. tick cost.
  failed_items_page_size: 100        # Default page size for /api/v2.1/admin/gc/failed-items listings.
  grace_period: 1h
  dry_run: false
  user_grace_days: 7                 # soft-deleted users purge after this many days
  org_grace_days: 30                 # soft-deleted orgs purge after this many days
  trash_retention_days: 30
  audit_retention_days: 365

cors:
  allowed_origins:
    - "*"                           # OK for local dev; in production set CORS_ALLOWED_ORIGINS env var (wildcard rejected)

elasticsearch:
  enabled: false                    # Search defaults to Cassandra indexes; enable only when wiring a real ES cluster
  urls:
    - "http://localhost:9200"
  index: sesamefs-files

monitoring:
  metrics_enabled: true
  metrics_path: /metrics
  health_timeout: 3s

# File preview and streaming settings
# These limits protect against memory exhaustion and browser freezing
fileview:
  max_preview_bytes: 1073741824       # 1 GiB - General files (images, PDFs, etc.)
  max_video_bytes: 10737418240        # 10 GiB - Videos (4K recordings, long videos)
  max_text_bytes: 52428800            # 50 MB - Text files (prevent browser freeze)
  max_iwork_preview_bytes: 52428800   # 50 MB - Extracted iWork previews
  preview_extensions:
    - pdf
    - png
    - jpg
    - jpeg
    - gif
    - bmp
    - webp
    - svg
    - ico
    - tiff
    - tif
    - mp4
    - webm
    - ogg
    - mov
    - mp3
    - wav
    - flac
    - aac
    - txt
    - md
    - markdown
    - json
    - yaml
    - yml
    - xml
    - csv
    - html
    - htm
    - css
    - js
    - ts
    - jsx
    - tsx
    - py
    - go
    - rs
    - java
    - c
    - cpp
    - h
    - hpp
    - sh
    - bash
    - zsh
    - fish
    - toml
    - ini
    - cfg
    - conf
    - env
    - sql
    - graphql
    - proto
    - dockerfile
    - makefile
    - rb
    - php
    - swift
    - kt
    - scala
    - r
    - lua
    - pl
    - log
    - diff
    - patch

# OnlyOffice Document Server integration
onlyoffice:
  enabled: true
  api_js_url: "https://office.sesamedisk.com/web-apps/apps/api/documents/api.js"
  jwt_secret: ""                       # Set via ONLYOFFICE_JWT_SECRET env var (required when enabled)
  jwt_ttl_seconds: 3600                 # Override via ONLYOFFICE_JWT_TTL_SECONDS (default 1 hour)
  max_document_bytes: 524288000        # Reject callback downloads larger than 500 MiB
  verify_certificate: false
  force_save: true
  # Optional explicit SesameFS URL for OnlyOffice to fetch documents.
  # If not set, SesameFS derives the browser-facing origin from the current
  # request and falls back to SERVER_URL only when needed.
  # server_url: "https://files.sesamedisk.com"
  internal_url: ""                     # Optional explicit OnlyOffice URL for callback downloads
  view_extensions:
    - doc
    - docx
    - ppt
    - pptx
    - xls
    - xlsx
    - odt
    - fodt
    - odp
    - fodp
    - ods
    - fods
    - pdf
  edit_extensions:
    - docx
    - pptx
    - xlsx

enforcement_profiles:
  hard:
    features:
      can_add_repo: true
      can_share_repo: true
      can_add_group: false
      can_generate_share_link: true
      can_generate_upload_link: true
      can_send_share_link_mail: false
      can_publish_repo: false
      can_use_global_address_book: false
      can_connect_with_desktop_clients: true
      can_connect_with_android_clients: true
      can_connect_with_ios_clients: true
      can_export_files_via_mobile_client: true
    limits:
      max_libraries: 3
      max_share_links: 3
      max_upload_links: 1
      share_link_expire_days_max: 3
      upload_link_expire_days_max: 3

  soft:
    features:
      can_add_repo: true
      can_share_repo: true
      can_add_group: true
      can_generate_share_link: true
      can_generate_upload_link: true
      can_send_share_link_mail: true
      can_publish_repo: true
      can_use_global_address_book: true
      can_connect_with_desktop_clients: true
      can_connect_with_android_clients: true
      can_connect_with_ios_clients: true
      can_export_files_via_mobile_client: true
    limits:
      max_libraries: -1
      max_share_links: -1
      max_upload_links: -1
      share_link_expire_days_max: 0
      upload_link_expire_days_max: 0

