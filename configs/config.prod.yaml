# =============================================================================
# SesameFS — Production Config
# =============================================================================
# This file contains STRUCTURAL configuration only — no secrets.
# All secrets (keys, passwords, tokens) come from environment variables.
# Load order at runtime:
#   1. internal/config.DefaultConfig() code defaults
#   2. YAML from CONFIG_PATH (this file in prod)
#   3. Environment variable overrides via applyEnvOverrides()
# Any key omitted here keeps the code default.
# This file is intentionally thinner than configs/config.docker.yaml, which pins more
# non-secret knobs explicitly for local/test reproducibility.
#
# This file is mounted over the config baked into the Docker image:
#   volumes:
#     - ./configs/config.prod.yaml:/app/config.yaml:ro
#
# Env var overrides (applied after this file is loaded):
#   AUTH_DEV_MODE, OIDC_*, ONLYOFFICE_*,
#   CASSANDRA_*, S3_BUCKET, S3_REGION, S3_ENDPOINT,
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, BILLING_URL,
#   SERVER_TRUSTED_PROXIES, FIRST_SUPERADMIN_EMAIL,
#   GC_ENABLED, GC_USER_GRACE_DAYS, GC_ORG_GRACE_DAYS,
#   GC_TRASH_RETENTION_DAYS, GC_AUDIT_RETENTION_DAYS,
#   ACCOUNTS_DELETE_ACCOUNT_URL,
#   ACCOUNTS_DISABLE_ORG_USER_WRITES
# =============================================================================

server:
  port: ":8080"
  read_timeout: 0s              # No timeout — large uploads can take minutes
  read_header_timeout: 10s      # Slowloris protection
  write_timeout: 0s             # No timeout — large downloads can take minutes
  max_upload_mb: 20480          # 20480 MB (~20 GiB) max upload
  trusted_proxies: []           # Configure exact nginx/load-balancer IP/CIDRs; empty disables X-Forwarded-For trust
  mobile_frontend_path: "./mobile-frontend/dist" # Built mobile frontend directory

# =============================================================================
# Database — host/credentials come from env vars
# =============================================================================
database:
  hosts:
    - cassandra:9042             # Docker service name, fixed
  keyspace: sesamefs
  consistency: LOCAL_QUORUM
  local_dc: datacenter1
  # username and password via: CASSANDRA_USERNAME, CASSANDRA_PASSWORD

# =============================================================================
# Storage — single-region production config (single AWS S3 bucket)
#
# This uses the legacy "backends:" format intentionally — it maps to a single
# named backend ("hot") resolved by the storage manager as the default class.
#
# When to migrate to "classes:":
#   When deploying multi-region (e.g. hot-s3-usa, hot-s3-eu, cold-glacier-usa),
#   replace this section with "classes:" + "endpoint_regions:" + "region_classes:"
#   following the structure in configs/config.example.yaml.
#
# Env vars that control this section:
#   S3_BUCKET    → bucket name
#   S3_REGION    → AWS region (e.g. us-east-1)
#   S3_ENDPOINT  → leave empty for real AWS; set for S3-compatible APIs (R2, Cloudflare, etc.)
#   S3_SERVER_SIDE_ENCRYPTION → AES256 or aws:kms
#   S3_SSE_KMS_KEY_ID         → optional KMS key ID/ARN when using aws:kms
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY → picked up by AWS SDK automatically
# =============================================================================
storage:
  default_class: hot

  backends:
    hot:
      type: s3
      bucket: ""                     # Set via S3_BUCKET env var
      region: ""                     # Set via S3_REGION env var
      endpoint: ""                   # Optional S3-compatible endpoint via S3_ENDPOINT env var
      server_side_encryption: "AES256" # Override via S3_SERVER_SIDE_ENCRYPTION; recommended for AWS S3
      sse_kms_key_id: ""               # Optional via S3_SSE_KMS_KEY_ID when using aws:kms
      # bucket, region, endpoint → overridden by S3_BUCKET, S3_REGION, S3_ENDPOINT
      # credentials → overridden by AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

# =============================================================================
# Authentication
# =============================================================================
auth:
  dev_mode: false               # Secure default; never enable in production
  dev_tokens: []                # Empty — no dev tokens in production
  first_superadmin_email: ""   # Optional bootstrap email via FIRST_SUPERADMIN_EMAIL env var
  share_link_hmac_key: ""      # REQUIRED via SHARE_LINK_HMAC_KEY env var in production

  # share_link_hmac_key → SHARE_LINK_HMAC_KEY env var (REQUIRED in production)
  # Generate: openssl rand -hex 32
  # Used to sign HTTP-only cookies that remember password-protected share/upload link
  # authentication for 24 hours. sesamefs refuses to start without a secure value.

  oidc:
    enabled: true               # Overridden by OIDC_ENABLED=true in compose
    issuer: ""                                # Required: set OIDC_ISSUER in .env
    # client_id     → OIDC_CLIENT_ID
    # client_secret → OIDC_CLIENT_SECRET
    redirect_uris: []                         # Required when OIDC is enabled; set via OIDC_REDIRECT_URIS
    org_claim: ""                            # Optional custom org claim via OIDC_ORG_CLAIM
    roles_claim: ""                          # Optional custom roles claim via OIDC_ROLES_CLAIM
    default_org_id: ""                       # Optional fallback org UUID via OIDC_DEFAULT_ORG_ID
    default_org_name: ""                     # Optional fallback org name via OIDC_DEFAULT_ORG_NAME
    allowed_org_claims: ""                   # Optional allowlist via OIDC_ALLOWED_ORG_CLAIMS
    platform_org_id: "00000000-0000-0000-0000-000000000000"
    platform_org_claim_value: ""             # Optional claim value that maps to the platform org
    # jwt_signing_key → OIDC_JWT_SIGNING_KEY

    scopes:
      - openid
      - profile
      - email

    auto_provision: false        # Keep disabled by default; Accounts should provision orgs/users explicitly
    default_role: user           # Role assigned to new users
    session_ttl: 24h             # Web browser sessions
    api_token_ttl: 4320h         # 180 days — desktop/mobile sync clients (Seafile/SeaDrive)
    refresh_token_ttl: 168h      # 7 days
    allow_offline_token: false
    groups_claim: ""                     # Optional group-membership claim via OIDC_GROUPS_CLAIM
    departments_claim: ""                # Optional department-membership claim via OIDC_DEPARTMENTS_CLAIM
    sync_groups_on_login: false
    sync_departments_on_login: false
    full_sync_groups: false
    full_sync_departments: false
    require_pkce: true
    validate_audience: true
    allowed_clock_skew: 2m

# =============================================================================
# Billing Portal
# Frontend links to /billing/ inside SesameFS; the backend redirects authenticated
# users to this external billing portal. Set the real destination with BILLING_URL.
# =============================================================================
billing:
  url: ""                      # Required in production via BILLING_URL

# =============================================================================
# Accounts Redirects
# Frontend links to /accounts/password/change/ and /accounts/delete/ inside SesameFS;
# the backend redirects authenticated users to the external Accounts service.
# =============================================================================
accounts:
  delete_account_url: ""       # Required in production via ACCOUNTS_DELETE_ACCOUNT_URL
  org_user_management_url: ""  # Optional Accounts org-member base URL; supports {org_id}. SesameFS appends view/action/user_email query params. Override with ACCOUNTS_ORG_USER_MANAGEMENT_URL
  disable_org_user_writes: true # Keep tenant org-admin user writes disabled unless explicitly re-enabled

# =============================================================================
# Organization plan/template defaults
# Any future free-tier adjustment should happen here, not in code.
# Used by superadmin org creation, OIDC auto-provisioning, and initial default org seed.
# =============================================================================
organizations:
  default_template: free
  templates:
    free:
      plan: free
      quota_policy: hard
      billing_cycle: monthly
      storage_quota: 2000000000      # any value <= 0 disables the org storage cap in SesameFS
      traffic_quota: 10000000000     # any value <= 0 disables the combined traffic cap in SesameFS
      traffic_upload_quota: -1       # any value <= 0 disables the upload-direction cap
      traffic_download_quota: -1     # any value <= 0 disables the download-direction cap
      max_users: 1                   # any value <= 0 disables the member cap in SesameFS
      chunking_polynomial: 17592186044415
      settings:
        theme: default
        features: all
      storage_config:
        default_backend: ""          # Optional; defaults to storage.default_class when empty

# =============================================================================
# Seafile HTTP (sync protocol token TTL)
# =============================================================================
seafhttp:
  token_ttl: 24h
  zip_max_entries: 100000
  zip_max_depth: 64
  zip_max_bytes: 10737418240

# =============================================================================
# Chunking
# =============================================================================
chunking:
  algorithm: fastcdc
  hash_algorithm: sha256
  adaptive:
    enabled: true
    absolute_min: 2097152       # 2 MB  (slow connections)
    absolute_max: 268435456     # 256 MB (datacenter)
    initial_size: 16777216      # 16 MB starting point
    target_seconds: 8
  probe:
    size: 1048576               # 1 MB probe
    timeout: 30s
  retry:
    chunk_timeout: 60s
    max_retries: 5
    reduce_on_timeout: 0.5
    reduce_on_failure: 0.5
    backoff_base: 1s
    backoff_max_jitter: 500ms

# =============================================================================
# Versioning & GC
# =============================================================================
versioning:
  default_ttl_days: 90
  min_ttl_days: 7
  gc_interval: 24h

gc:
  enabled: false                  # Safe default; enable explicitly with GC_ENABLED=true on the designated GC replica
  worker_interval: 30s
  scan_interval: 24h
  batch_size: 100
  reconcile_batch_size: 256       # Dirty orgs reconciled per worker/scanner tick (0 = all). Drives gc_stats snapshot freshness.
  failed_items_page_size: 100     # Default page size for the admin DLQ listing endpoint.
  grace_period: 1h
  dry_run: false
  user_grace_days: 7
  org_grace_days: 30
  trash_retention_days: 30
  audit_retention_days: 365

# Production activation pattern:
# keep gc.enabled=false in YAML and set GC_ENABLED=true only on the replica that
# should participate in GC. Lease-based coordination still protects against
# accidental overlap if more than one replica is enabled.

# =============================================================================
# CORS
# Set your production domain(s) via env var:
#   CORS_ALLOWED_ORIGINS=https://sfs.example.com,https://app.example.com
# Wildcard "*" is rejected in production mode.
# =============================================================================
cors:
  allowed_origins: []              # Required via CORS_ALLOWED_ORIGINS env var

# =============================================================================
# Search Backend
# Search defaults to Cassandra indexes; keep Elasticsearch disabled unless a real
# cluster is provisioned and wired via env or structural config.
# =============================================================================
elasticsearch:
  enabled: false
  urls:
    - "http://localhost:9200"
  index: sesamefs-files

# =============================================================================
# Monitoring
# =============================================================================
monitoring:
  metrics_enabled: true
  metrics_path: /metrics        # Blocked from external access in nginx
  health_timeout: 3s

# =============================================================================
# File Preview Limits
# =============================================================================
fileview:
  max_preview_bytes: 1073741824    # 1 GiB - general files (images, PDFs)
  max_video_bytes: 10737418240     # 10 GiB - videos
  max_text_bytes: 52428800         # 50 MB — text files
  max_iwork_preview_bytes: 52428800 # 50 MB — iWork previews
  preview_extensions:
    - pdf
    - png
    - jpg
    - jpeg
    - gif
    - bmp
    - webp
    - svg
    - ico
    - tiff
    - tif
    - mp4
    - webm
    - ogg
    - mov
    - mp3
    - wav
    - flac
    - aac
    - txt
    - md
    - markdown
    - json
    - yaml
    - yml
    - xml
    - csv
    - html
    - htm
    - css
    - js
    - ts
    - jsx
    - tsx
    - py
    - go
    - rs
    - java
    - c
    - cpp
    - h
    - hpp
    - sh
    - bash
    - zsh
    - fish
    - toml
    - ini
    - cfg
    - conf
    - env
    - sql
    - graphql
    - proto
    - dockerfile
    - makefile
    - rb
    - php
    - swift
    - kt
    - scala
    - r
    - lua
    - pl
    - log
    - diff
    - patch

# =============================================================================
# Enforcement Profiles
# Feature flags and numeric product-policy limits are keyed by quota_policy.
# Quota numbers themselves still come from organizations.* or Accounts.
# =============================================================================
enforcement_profiles:
  hard:
    features:
      can_add_repo: true
      can_share_repo: true
      can_add_group: false
      can_generate_share_link: true
      can_generate_upload_link: true
      can_send_share_link_mail: false
      can_publish_repo: false
      can_use_global_address_book: false
      can_connect_with_desktop_clients: true
      can_connect_with_android_clients: true
      can_connect_with_ios_clients: true
      can_export_files_via_mobile_client: true
    limits:
      max_libraries: 3
      max_share_links: 3
      max_upload_links: 1
      share_link_expire_days_max: 3
      upload_link_expire_days_max: 3

  soft:
    features:
      can_add_repo: true
      can_share_repo: true
      can_add_group: true
      can_generate_share_link: true
      can_generate_upload_link: true
      can_send_share_link_mail: true
      can_publish_repo: true
      can_use_global_address_book: true
      can_connect_with_desktop_clients: true
      can_connect_with_android_clients: true
      can_connect_with_ios_clients: true
      can_export_files_via_mobile_client: true
    limits:
      max_libraries: -1
      max_share_links: -1
      max_upload_links: -1
      share_link_expire_days_max: 0
      upload_link_expire_days_max: 0

# =============================================================================
# OnlyOffice Document Server
# NOTE: enabled, jwt_secret, api_js_url → overridden by env vars in compose.
# The internal Docker network URLs below CANNOT come from env vars.
# =============================================================================
onlyoffice:
  enabled: true                 # Overridden by ONLYOFFICE_ENABLED=true in compose
  jwt_secret: ""                # Set via ONLYOFFICE_JWT_SECRET env var (required when enabled)
  api_js_url: ""                # Set via ONLYOFFICE_API_JS_URL env var
  jwt_ttl_seconds: 3600         # Override via ONLYOFFICE_JWT_TTL_SECONDS (default 1 hour)
  max_document_bytes: 524288000 # Reject callback downloads larger than 500 MiB

  # Internal Docker network — OnlyOffice fetches files from sesamefs
  server_url: "http://sesamefs:8080"

  # Internal Docker network — sesamefs contacts OnlyOffice for conversions
  internal_url: "http://onlyoffice:80"

  verify_certificate: false
  force_save: true

  view_extensions:
    - doc
    - docx
    - ppt
    - pptx
    - xls
    - xlsx
    - odt
    - fodt
    - odp
    - fodp
    - ods
    - fods
    - pdf

  edit_extensions:
    - docx
    - pptx
    - xlsx
