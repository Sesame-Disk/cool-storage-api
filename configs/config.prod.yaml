# =============================================================================
# SesameFS — Production Config
# =============================================================================
# This file contains STRUCTURAL configuration only — no secrets.
# All secrets (keys, passwords, tokens) come from environment variables.
# Load order at runtime:
#   1. internal/config.DefaultConfig() code defaults
#   2. YAML from CONFIG_PATH (this file in prod)
#   3. Environment variable overrides via applyEnvOverrides()
# Any key omitted here keeps the code default.
# This file is intentionally thinner than configs/config.docker.yaml, which pins more
# non-secret knobs explicitly for local/test reproducibility.
#
# This file is mounted over the config baked into the Docker image:
#   volumes:
#     - ./configs/config.prod.yaml:/app/config.yaml:ro
#
# Env var overrides (applied after this file is loaded):
#   AUTH_DEV_MODE, OIDC_*, ONLYOFFICE_*,
#   CASSANDRA_*, S3_BUCKET, S3_REGION, S3_ENDPOINT,
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_CLASS_<CLASS>_*,
#   BILLING_URL, SERVER_URL,
#   SERVER_TRUSTED_PROXIES, DESKTOP_CUSTOM_BRAND,
#   DESKTOP_CUSTOM_LOGO, FIRST_SUPERADMIN_EMAIL,
#   GC_ENABLED, GC_USER_GRACE_DAYS, GC_ORG_GRACE_DAYS,
#   GC_TRASH_RETENTION_DAYS, GC_AUDIT_RETENTION_DAYS,
#   ACCOUNTS_DELETE_ACCOUNT_URL,
#   ACCOUNTS_DISABLE_ORG_USER_WRITES
# =============================================================================

server:
  port: ":8080"
  read_timeout: 0s              # No timeout — large uploads can take minutes
  read_header_timeout: 10s      # Slowloris protection
  write_timeout: 0s             # No timeout — large downloads can take minutes
  max_upload_mb: 102400         # 102400 MB (~100 GiB) max upload
  trusted_proxies: []           # Configure exact nginx/load-balancer IP/CIDRs; empty disables X-Forwarded-For trust
  url: ""                      # Optional explicit public base URL; usually leave empty and let SesameFS derive it from request/proxy headers
  desktop_custom_brand: ""     # Optional desktop-client brand label override
  desktop_custom_logo: ""      # Optional desktop-client logo URL override
  region: ""                   # Set via SERVER_REGION in multi-region; used as the node-local default when host-based routing does not pick a region
  mobile_frontend_path: "./mobile-frontend/dist" # Built mobile frontend directory

# =============================================================================
# Database — host/credentials come from env vars
# =============================================================================
database:
  hosts:
    - cassandra:9042             # Docker service name, fixed
  keyspace: sesamefs
  consistency: LOCAL_QUORUM
  serial_consistency: SERIAL
  proto_version: 4              # CQL protocol version (3/4/5); pin to 4 to silence Cassandra's "Keyspace is set via query options" warning; override via CASSANDRA_PROTO_VERSION
  timeout: 25s                  # Safe initial prod value for multi-DC LWT/upload testing; override via CASSANDRA_TIMEOUT if needed
  local_dc: datacenter1
  replication_class: NetworkTopologyStrategy
  replication_dcs:
    datacenter1: 1
  # username and password via: CASSANDRA_USERNAME, CASSANDRA_PASSWORD
  # replication env overrides: CASSANDRA_REPLICATION_CLASS, CASSANDRA_REPLICATION_DCS
  # legacy-only fallback: CASSANDRA_REPLICATION_FACTOR when using SimpleStrategy

# =============================================================================
# Storage — shared production config for both single-region and multi-region
#
# Single-region:
#   - leave SERVER_REGION unset
#   - fill S3_* env vars for the legacy "hot" backend below
#   - runtime overrides switch the effective default_class back to "hot"
#
# Multi-region:
#   - set SERVER_REGION per node (na/eu/asia)
#   - keep regions/failover chains in storage.classes below
#   - set per-class buckets via S3_CLASS_<CLASS>_BUCKET env vars
#   - region_classes take precedence over default_class when a request hostname maps to a specific region
#
# Credentials can come from either:
#   - class-specific env vars: S3_CLASS_<CLASS>_ACCESS_KEY_ID / SECRET_ACCESS_KEY
#   - default env vars: S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
# =============================================================================
storage:
  mode: "multi"
  default_class: hot-s3-na

  classes:
    hot-s3-na:
      label: North America
      type: s3
      tier: hot
      endpoint: ""                   # Leave empty for provider-native S3; set only for custom S3-compatible APIs
      bucket: ""                     # Set via S3_CLASS_HOT_S3_NA_BUCKET
      region: us-east-1
      server_side_encryption: "AES256"
      sse_kms_key_id: ""
      failover_class: hot-s3-eu

    hot-s3-eu:
      label: Europe
      type: s3
      tier: hot
      endpoint: ""
      bucket: ""                     # Set via S3_CLASS_HOT_S3_EU_BUCKET
      region: eu-west-1
      server_side_encryption: "AES256"
      sse_kms_key_id: ""
      failover_class: hot-s3-na

    hot-s3-asia:
      label: Asia Pacific
      type: s3
      tier: hot
      endpoint: ""
      bucket: ""                     # Set via S3_CLASS_HOT_S3_ASIA_BUCKET
      region: ap-southeast-1
      server_side_encryption: "AES256"
      sse_kms_key_id: ""
      failover_class: hot-s3-eu

  endpoint_regions: {}
    # Keep explicit hostname rules only for special cases. In the standard
    # per-region hostname topology, SERVER_REGION decides the node-local default.

  region_classes:
    na:
      hot: hot-s3-na
      cold: ""
    eu:
      hot: hot-s3-eu
      cold: ""
    asia:
      hot: hot-s3-asia
      cold: ""

  # Legacy single-region backend, kept for compatibility with the env-driven
  # production path used by existing single-bucket deployments.
  backends:
    hot:
      type: s3
      endpoint: ""
      bucket: ""
      region: ""
      server_side_encryption: "AES256"
      sse_kms_key_id: ""

# =============================================================================
# Authentication
# =============================================================================
auth:
  dev_mode: false               # Secure default; never enable in production
  dev_tokens: []                # Empty — no dev tokens in production
  first_superadmin_email: ""   # Optional bootstrap email via FIRST_SUPERADMIN_EMAIL env var
  share_link_hmac_key: ""      # REQUIRED via SHARE_LINK_HMAC_KEY env var in production

  # share_link_hmac_key → SHARE_LINK_HMAC_KEY env var (REQUIRED in production)
  # Generate: openssl rand -hex 32
  # Used to sign HTTP-only cookies that remember password-protected share/upload link
  # authentication for 24 hours. sesamefs refuses to start without a secure value.

  oidc:
    enabled: true               # Overridden by OIDC_ENABLED=true in compose
    issuer: ""                                # Required: set OIDC_ISSUER in .env
    # client_id     → OIDC_CLIENT_ID
    # client_secret → OIDC_CLIENT_SECRET
    redirect_uris: []                         # Required when OIDC is enabled; set via OIDC_REDIRECT_URIS
    org_claim: ""                            # Optional custom org claim via OIDC_ORG_CLAIM
    roles_claim: ""                          # Optional custom roles claim via OIDC_ROLES_CLAIM
    default_org_id: ""                       # Optional fallback org UUID via OIDC_DEFAULT_ORG_ID
    default_org_name: ""                     # Optional fallback org name via OIDC_DEFAULT_ORG_NAME
    allowed_org_claims: ""                   # Optional allowlist via OIDC_ALLOWED_ORG_CLAIMS
    platform_org_id: "00000000-0000-0000-0000-000000000000"
    platform_org_claim_value: ""             # Optional claim value that maps to the platform org
    # jwt_signing_key → OIDC_JWT_SIGNING_KEY

    scopes:
      - openid
      - profile
      - email

    auto_provision: false        # Keep disabled by default; Accounts should provision orgs/users explicitly
    default_role: user           # Role assigned to new users
    session_ttl: 24h             # Web browser sessions
    api_token_ttl: 4320h         # 180 days — desktop/mobile sync clients (Seafile/SeaDrive)
    refresh_token_ttl: 168h      # 7 days
    allow_offline_token: false
    groups_claim: ""                     # Optional group-membership claim via OIDC_GROUPS_CLAIM
    departments_claim: ""                # Optional department-membership claim via OIDC_DEPARTMENTS_CLAIM
    sync_groups_on_login: false
    sync_departments_on_login: false
    full_sync_groups: false
    full_sync_departments: false
    require_pkce: true
    validate_audience: true
    allowed_clock_skew: 2m

# =============================================================================
# Billing Portal
# Frontend links to /billing/ inside SesameFS; the backend redirects authenticated
# users to this external billing portal. Set the real destination with BILLING_URL.
# =============================================================================
billing:
  url: ""                      # Required in production via BILLING_URL

# =============================================================================
# Accounts Redirects
# Frontend links to /accounts/password/change/ and /accounts/delete/ inside SesameFS;
# the backend redirects authenticated users to the external Accounts service.
# =============================================================================
accounts:
  delete_account_url: ""       # Required in production via ACCOUNTS_DELETE_ACCOUNT_URL
  org_user_management_url: ""  # Optional Accounts org-member base URL; supports {org_id}. SesameFS appends view/action/user_email query params. Override with ACCOUNTS_ORG_USER_MANAGEMENT_URL
  disable_org_user_writes: true # Keep tenant org-admin user writes disabled unless explicitly re-enabled

# =============================================================================
# Organization plan/template defaults
# Any future free-tier adjustment should happen here, not in code.
# Used by superadmin org creation, OIDC auto-provisioning, and initial default org seed.
# =============================================================================
organizations:
  default_template: free
  templates:
    free:
      plan: free
      quota_policy: hard
      billing_cycle: monthly
      storage_quota: 2000000000      # any value <= 0 disables the org storage cap in SesameFS
      traffic_quota: 10000000000     # any value <= 0 disables the combined traffic cap in SesameFS
      traffic_upload_quota: -1       # any value <= 0 disables the upload-direction cap
      traffic_download_quota: -1     # any value <= 0 disables the download-direction cap
      max_users: 1                   # any value <= 0 disables the member cap in SesameFS
      chunking_polynomial: 17592186044415
      settings:
        theme: default
        features: all
      storage_config:
        default_backend: ""          # Optional; defaults to storage.default_class when empty

web_uploads:
  enable_upload_folder: true
  enable_resumable_file_upload: true
  enable_web_block_upload: false  # content-addressed (block) web upload flow; off until phase-1 rollout
  resumable_chunk_size_mb: 8
  web_block_upload_block_size_mb: 8
  max_file_size_mb: 0                # 0 = use server.max_upload_mb
  max_files_per_batch: 1000
  simultaneous_uploads: 3  # Max parallel browser upload slots; the adaptive client starts at 1 and only ramps up to this ceiling on stable networks
  max_concurrent_block_uploads_per_user: 8  # Anti-abuse cap on concurrent session-mode /blocks/upload per user; RAM/user ~= cap x block_size (8x8MB=64MB); <=0 disables
  max_uncommitted_block_sessions_per_user: 8  # Max concurrent uncommitted web block-upload sessions per user (LWT slots); <=0 disables
  max_staged_bytes_per_session_mb: 0  # Per-session staged-bytes ceiling = max web-block file size; 0=derive from max file size x1.25, <0 disables

# =============================================================================
# Seafile HTTP (sync protocol token TTL)
# =============================================================================
seafhttp:
  token_ttl: 24h
  zip_max_entries: 100000
  zip_max_depth: 64
  zip_max_bytes: 10737418240
  chunked_staging_max_bytes: 0 # 0 = unlimited; set a deployment-specific byte budget per node to cap active chunked temp-file staging
  # Per-request body cap for PUT /seafhttp/repo/:repo_id/block/:block_id. PutBlock
  # buffers the whole body before hashing, so this is the per-request buffered-body
  # bound on the desktop-sync block route — the dominant term in its memory cost,
  # not a hard ceiling on it. Sized with ample headroom over the official client
  # CDC maximum and SesameFS's related 8 MiB split, not the web uploader; using
  # that unrelated ceiling is how the previous 257 MiB bound arose. Rejected values: 0 or negative (an
  # unbounded body is the defect) and anything above 64 MiB.
  # Override: SEAFHTTP_SYNC_BLOCK_MAX_BYTES
  # NOT an aggregate bound: N concurrent uploads still cost N x this value.
  sync_block_max_bytes: 16777216 # 16 MiB
  # Per-IP-and-stable-link bound on ANONYMOUS writes through a public upload link (only
  # tokens whose source is "link"; authenticated web uploads on the same endpoint
  # are untouched). Keyed on both so one uploader behind a NAT does not throttle
  # everyone else behind that address using a different link. 0 disables.
  # These are generous starting values, not measured ones: the failure mode of a
  # rate limit on a data path is a real person's upload dying, so tighten them
  # from upload_link_write_throttled_total rather than guessing downward.
  # Behind an untrusted proxy, clients using the same link share the proxy-IP
  # bucket; different links remain isolated. Limits are per node, not cluster-wide.
  # Overrides: SEAFHTTP_UPLOAD_LINK_WRITES_PER_MINUTE, SEAFHTTP_UPLOAD_LINK_WRITE_BURST
  upload_link_writes_per_minute: 600
  upload_link_write_burst: 1200

  # Process-local bound on writes against ONE stable public-link identity across
  # all client IPs. The identity survives seafhttp token remints, so this bucket
  # sees a leaked upload URL hit from many addresses at once. Set far
  # above the per-client bound because a shared link legitimately serves many
  # people at once. 0 disables.
  # Overrides: SEAFHTTP_UPLOAD_LINK_SOURCE_WRITES_PER_MINUTE, SEAFHTTP_UPLOAD_LINK_SOURCE_WRITE_BURST
  upload_link_source_writes_per_minute: 12000
  upload_link_source_write_burst: 24000

  # Process-local concurrency caps keyed by the same stable source; remints do
  # not reset them. Fleet capacity scales with nodes. 0 disables either cap.
  # Overrides: SEAFHTTP_UPLOAD_LINK_MAX_INFLIGHT_PER_SOURCE, SEAFHTTP_UPLOAD_LINK_MAX_INFLIGHT_PER_NODE
  upload_link_max_inflight_per_source: 16
  upload_link_max_inflight_per_node: 128

# =============================================================================
# Chunking
# =============================================================================
chunking:
  algorithm: fastcdc
  hash_algorithm: sha256
  adaptive:
    enabled: true
    absolute_min: 2097152       # 2 MB  (slow connections)
    absolute_max: 268435456     # 256 MB (datacenter)
    initial_size: 16777216      # 16 MB starting point
    target_seconds: 8
  probe:
    size: 1048576               # 1 MB probe
    timeout: 30s
  retry:
    chunk_timeout: 60s
    max_retries: 5
    reduce_on_timeout: 0.5
    reduce_on_failure: 0.5
    backoff_base: 1s
    backoff_max_jitter: 500ms

# =============================================================================
# Versioning & GC
# =============================================================================
versioning:
  default_ttl_days: 90
  min_ttl_days: 7
  gc_interval: 24h

gc:
  enabled: false                  # Required on every replica/DC while GC safety blockers X1/X2 remain open
  worker_interval: 30s
  scan_interval: 24h
  batch_size: 100
  reconcile_batch_size: 256       # Dirty orgs reconciled per worker/scanner tick (0 = all). Drives gc_stats snapshot freshness.
  failed_items_page_size: 100     # Default page size for the admin DLQ listing endpoint.
  grace_period: 1h
  dry_run: false
  user_grace_days: 7
  org_grace_days: 30
  trash_retention_days: 30
  audit_retention_days: 365

# Production activation gate:
# keep gc.enabled=false and GC_ENABLED=false on EVERY replica in EVERY DC while
# X1 (physical-delete ABA) or X2 (cross-DC reference visibility) remains open.
# The LWT lease does not close either blocker. Only after both close may designated
# replicas in one DC set GC_ENABLED=true and participate under the lease; every
# replica in every other DC remains false.

# =============================================================================
# CORS
# Set your production browser origin allow-list via env var:
#   CORS_ALLOWED_ORIGINS=https://sfs.example.com,https://app.example.com
# Wildcard "*" is rejected in production mode.
# =============================================================================
cors:
  allowed_origins: []              # Required via CORS_ALLOWED_ORIGINS env var

# =============================================================================
# Search Backend
# Search defaults to Cassandra indexes; keep Elasticsearch disabled unless a real
# cluster is provisioned and wired via env or structural config.
# =============================================================================
elasticsearch:
  enabled: false
  urls:
    - "http://localhost:9200"
  index: sesamefs-files

# =============================================================================
# Monitoring
# =============================================================================
monitoring:
  metrics_enabled: true
  metrics_path: /metrics        # Blocked from external access in nginx
  health_timeout: 3s

# =============================================================================
# File Preview Limits
# =============================================================================
fileview:
  max_preview_bytes: 1073741824    # 1 GiB - general files (images, PDFs)
  max_video_bytes: 10737418240     # 10 GiB - videos
  max_text_bytes: 52428800         # 50 MB — text files
  max_iwork_preview_bytes: 52428800 # 50 MB — iWork previews
  preview_extensions:
    - pdf
    - png
    - jpg
    - jpeg
    - gif
    - bmp
    - webp
    - svg
    - ico
    - tiff
    - tif
    - mp4
    - webm
    - ogg
    - mov
    - mp3
    - wav
    - flac
    - aac
    - txt
    - md
    - markdown
    - json
    - yaml
    - yml
    - xml
    - csv
    - html
    - htm
    - css
    - js
    - ts
    - jsx
    - tsx
    - py
    - go
    - rs
    - java
    - c
    - cpp
    - h
    - hpp
    - sh
    - bash
    - zsh
    - fish
    - toml
    - ini
    - cfg
    - conf
    - env
    - sql
    - graphql
    - proto
    - dockerfile
    - makefile
    - rb
    - php
    - swift
    - kt
    - scala
    - r
    - lua
    - pl
    - log
    - diff
    - patch

# =============================================================================
# Enforcement Profiles
# Feature flags and numeric product-policy limits are keyed by quota_policy.
# Quota numbers themselves still come from organizations.* or Accounts.
# =============================================================================
enforcement_profiles:
  hard:
    features:
      can_add_repo: true
      can_share_repo: true
      can_add_group: false
      can_generate_share_link: true
      can_generate_upload_link: true
      can_send_share_link_mail: false
      can_publish_repo: false
      can_use_global_address_book: false
      can_connect_with_desktop_clients: true
      can_connect_with_android_clients: true
      can_connect_with_ios_clients: true
      can_export_files_via_mobile_client: true
    limits:
      max_libraries: 3
      max_share_links: 3
      max_upload_links: 1
      share_link_expire_days_max: 3
      upload_link_expire_days_max: 3

  soft:
    features:
      can_add_repo: true
      can_share_repo: true
      can_add_group: true
      can_generate_share_link: true
      can_generate_upload_link: true
      can_send_share_link_mail: true
      can_publish_repo: true
      can_use_global_address_book: true
      can_connect_with_desktop_clients: true
      can_connect_with_android_clients: true
      can_connect_with_ios_clients: true
      can_export_files_via_mobile_client: true
    limits:
      max_libraries: -1
      max_share_links: -1
      max_upload_links: -1
      share_link_expire_days_max: 0
      upload_link_expire_days_max: 0

# =============================================================================
# OnlyOffice Document Server
# NOTE: prod only needs ONLYOFFICE_ENABLED, ONLYOFFICE_API_JS_URL, and
# ONLYOFFICE_JWT_SECRET from the environment. Leave the URLs below empty unless
# you need an explicit override.
# =============================================================================
onlyoffice:
  enabled: true                 # Overridden by ONLYOFFICE_ENABLED=true in compose
  jwt_secret: ""                # Set via ONLYOFFICE_JWT_SECRET env var (required when enabled)
  api_js_url: ""                # Set via ONLYOFFICE_API_JS_URL env var
  jwt_ttl_seconds: 3600         # Override via ONLYOFFICE_JWT_TTL_SECONDS (default 1 hour)
  max_document_bytes: 524288000 # Reject callback downloads larger than 500 MiB

  # Optional explicit URL that OnlyOffice should use to reach SesameFS.
  # Leave empty to derive the public SesameFS origin from the current request.
  server_url: ""

  # Optional explicit URL that SesameFS should use to reach OnlyOffice.
  # Leave empty to reuse the host from ONLYOFFICE_API_JS_URL.
  internal_url: ""

  verify_certificate: false
  force_save: true

  view_extensions:
    - doc
    - docx
    - ppt
    - pptx
    - xls
    - xlsx
    - odt
    - fodt
    - odp
    - fodp
    - ods
    - fods
    - pdf

  edit_extensions:
    - docx
    - pptx
    - xlsx
