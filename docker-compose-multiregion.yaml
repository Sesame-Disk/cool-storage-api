# Multi-Region Test Environment
#
# This setup simulates a multi-region deployment with:
# - nginx as load balancer/entry point
# - 2 SesameFS servers (USA and EU regions)
# - MinIO with separate buckets per region
# - Shared Cassandra database
#
# Usage:
#   docker-compose -f docker-compose-multiregion.yaml up -d
#
# Test endpoints:
#   - http://localhost:8080 (nginx - load balanced)
#   - http://us.sesamefs.local:8080 (routes to USA server)
#   - http://eu.sesamefs.local:8080 (routes to EU server)
#
# Add to /etc/hosts:
#   127.0.0.1 us.sesamefs.local eu.sesamefs.local sesamefs.local
#
# Test failover:
#   docker-compose -f docker-compose-multiregion.yaml stop sesamefs-usa
#   # Requests should failover to EU

services:
  # ==========================================================================
  # NGINX - Entry Point / Load Balancer
  # ==========================================================================
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./configs/nginx-multiregion.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sesamefs-usa
      - sesamefs-eu
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==========================================================================
  # SESAMEFS SERVERS
  # ==========================================================================

  # USA Region Server
  sesamefs-usa:
    build:
      context: .
      dockerfile: Dockerfile
    # Direct host port so integration tests can hit each region without going
    # through the LB. Override the host port with SESAMEFS_USA_HOST_PORT.
    ports:
      - "${SESAMEFS_USA_HOST_PORT:-3000}:8080"
    environment:
      - PORT=${PORT:-8080}
      - SERVER_REGION=usa
      - CASSANDRA_HOSTS=${CASSANDRA_HOSTS:-cassandra:9042}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-sesamefs}
      - CASSANDRA_LOCAL_DC=${CASSANDRA_LOCAL_DC:-datacenter1}
      - AUTH_DEV_MODE=${AUTH_DEV_MODE:-true}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      cassandra:
        condition: service_healthy
      cassandra-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./configs/config-usa.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # EU Region Server
  sesamefs-eu:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SESAMEFS_EU_HOST_PORT:-4001}:8080"
    environment:
      - PORT=${PORT:-8080}
      - SERVER_REGION=eu
      - CASSANDRA_HOSTS=${CASSANDRA_HOSTS:-cassandra:9042}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-sesamefs}
      - CASSANDRA_LOCAL_DC=${CASSANDRA_LOCAL_DC:-datacenter1}
      - AUTH_DEV_MODE=${AUTH_DEV_MODE:-true}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      cassandra:
        condition: service_healthy
      cassandra-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./configs/config-eu.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ==========================================================================
  # STORAGE - MinIO (S3-compatible)
  # ==========================================================================
  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"      # S3 API
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_multiregion_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Initialize MinIO buckets for each region
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      sleep 5;
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      echo 'Creating regional buckets...';
      mc mb myminio/sesamefs-usa --ignore-existing;
      mc mb myminio/sesamefs-eu --ignore-existing;
      mc mb myminio/sesamefs-blocks --ignore-existing;
      mc mb myminio/sesamefs-archive --ignore-existing;
      echo 'Buckets created:';
      mc ls myminio;
      echo 'MinIO initialization complete!';
      exit 0;
      "

  # ==========================================================================
  # TEST RUNNER - For running tests inside the Docker network
  # ==========================================================================
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nginx
    environment:
      - TOKEN=dev-token-123
      - BASE_URL=http://nginx:80
      - USA_URL=http://sesamefs-usa:8080
      - EU_URL=http://sesamefs-eu:8080
    profiles:
      - test

  # ==========================================================================
  # DATABASE - Cassandra (Shared)
  # ==========================================================================
  cassandra:
    image: cassandra:5.0
    ports:
      - "${CASSANDRA_HOST_PORT:-9042}:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER_NAME:-sesamefs-multiregion}
      - CASSANDRA_DC=${CASSANDRA_DC:-datacenter1}
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=${CASSANDRA_MAX_HEAP_SIZE:-512M}
      - HEAP_NEWSIZE=${CASSANDRA_HEAP_NEWSIZE:-100M}
    volumes:
      - cassandra_multiregion_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Initialize the shared keyspace before either region server boots. The app
  # runs migrations on startup, but it still requires the keyspace to exist.
  cassandra-bootstrap:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        set -euo pipefail
        keyspace="$${CASSANDRA_KEYSPACE:-sesamefs}"
        local_dc="$${CASSANDRA_DC:-$${CASSANDRA_LOCAL_DC:-datacenter1}}"

        case "$${keyspace}" in
          [A-Za-z][A-Za-z0-9_]*) ;;
          *) echo "Invalid Cassandra keyspace identifier: $${keyspace}" >&2; exit 1 ;;
        esac

        replication="{'class': 'NetworkTopologyStrategy', '$${local_dc}': 1}"
        cqlsh cassandra -e "CREATE KEYSPACE IF NOT EXISTS $${keyspace} WITH replication = $${replication};"
        cqlsh cassandra -e "ALTER KEYSPACE $${keyspace} WITH replication = $${replication};"
    environment:
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-sesamefs}
      - CASSANDRA_DC=${CASSANDRA_DC:-datacenter1}
      - CASSANDRA_LOCAL_DC=${CASSANDRA_LOCAL_DC:-datacenter1}
    restart: "no"

volumes:
  cassandra_multiregion_data:
  minio_multiregion_data:

networks:
  default:
    name: sesamefs-multiregion
