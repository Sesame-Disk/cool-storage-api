# Multi-region stack — "baked" variant (no runtime workspace bind mounts).
#
# This is a self-contained equivalent of docker-compose-multiregion.yaml for
# environments whose Docker daemon cannot bind-mount workspace files at runtime.
# Region configs and the nginx LB config are baked into images at build time
# instead of being mounted. Also adds a React frontend + a Playwright runner.
#
# Driven by scripts/run-playwright.sh. Ports default to the approved free list.
services:
  # ==========================================================================
  # Database — shared Cassandra (no auth, single DC)
  # ==========================================================================
  cassandra:
    image: cassandra:5.0
    ports:
      - "${CASSANDRA_HOST_PORT:-8081}:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER_NAME:-sesamefs-multiregion}
      - CASSANDRA_DC=${CASSANDRA_DC:-datacenter1}
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=${CASSANDRA_MAX_HEAP_SIZE:-512M}
      - HEAP_NEWSIZE=${CASSANDRA_HEAP_NEWSIZE:-100M}
    volumes:
      - cassandra_mr_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  cassandra-bootstrap:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        set -euo pipefail
        keyspace="$${CASSANDRA_KEYSPACE:-sesamefs}"
        local_dc="$${CASSANDRA_DC:-datacenter1}"
        case "$${keyspace}" in
          [A-Za-z][A-Za-z0-9_]*) ;;
          *) echo "Invalid keyspace: $${keyspace}" >&2; exit 1 ;;
        esac
        replication="{'class': 'NetworkTopologyStrategy', '$${local_dc}': 1}"
        cqlsh cassandra -e "CREATE KEYSPACE IF NOT EXISTS $${keyspace} WITH replication = $${replication};"
        cqlsh cassandra -e "ALTER KEYSPACE $${keyspace} WITH replication = $${replication};"
    environment:
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-sesamefs}
      - CASSANDRA_DC=${CASSANDRA_DC:-datacenter1}
    restart: "no"

  # ==========================================================================
  # Storage — MinIO with per-region buckets
  # ==========================================================================
  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_HOST_PORT:-5000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-8002}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_mr_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/sesamefs-usa --ignore-existing;
      mc mb myminio/sesamefs-eu --ignore-existing;
      mc mb myminio/sesamefs-blocks --ignore-existing;
      mc mb myminio/sesamefs-archive --ignore-existing;
      mc anonymous set download myminio/sesamefs-usa;
      mc anonymous set download myminio/sesamefs-eu;
      mc anonymous set download myminio/sesamefs-blocks;
      mc ls myminio;
      exit 0;
      "

  # ==========================================================================
  # Region servers — region config baked in via CONFIG_FILE build arg
  # ==========================================================================
  sesamefs-usa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONFIG_FILE: configs/config-usa.yaml
    ports:
      - "${SESAMEFS_USA_HOST_PORT:-8088}:8080"
    environment:
      - PORT=8080
      - SERVER_REGION=usa
      - CASSANDRA_HOSTS=cassandra:9042
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-sesamefs}
      - CASSANDRA_LOCAL_DC=${CASSANDRA_DC:-datacenter1}
      - AUTH_DEV_MODE=true
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      cassandra:
        condition: service_healthy
      cassandra-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      default:
        aliases:
          - sesamefs   # the prebuilt frontend image proxies to host `sesamefs:8080`
    restart: unless-stopped

  sesamefs-eu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONFIG_FILE: configs/config-eu.yaml
    ports:
      - "${SESAMEFS_EU_HOST_PORT:-8000}:8080"
    environment:
      - PORT=8080
      - SERVER_REGION=eu
      - CASSANDRA_HOSTS=cassandra:9042
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-sesamefs}
      - CASSANDRA_LOCAL_DC=${CASSANDRA_DC:-datacenter1}
      - AUTH_DEV_MODE=true
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      cassandra:
        condition: service_healthy
      cassandra-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ==========================================================================
  # nginx load balancer — config baked in
  # ==========================================================================
  nginx:
    build:
      context: .
      dockerfile: docker/multiregion/Dockerfile.nginx
    ports:
      - "${LB_HOST_PORT:-8080}:80"
    depends_on:
      - sesamefs-usa
      - sesamefs-eu
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==========================================================================
  # Web UI (React SPA) — proxies to the USA region (aliased as `sesamefs`)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      sesamefs-usa:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Playwright runner — executes the whole e2e-sesamefs suite (profile: test)
  # ==========================================================================
  playwright:
    build:
      context: .
      dockerfile: Dockerfile.mobiletest
    environment:
      - CI=true
      - DESKTOP_BASE_URL=${DESKTOP_BASE_URL:-http://frontend}
      - PW_RETRIES=${PW_RETRIES:-0}
    depends_on:
      - frontend
    command:
      - bash
      - -lc
      - npx playwright test --config=playwright.sesamefs.config.ts --grep-invert @bug
    profiles:
      - test

volumes:
  cassandra_mr_data:
  minio_mr_data:

networks:
  default:
    name: sesamefs-multiregion
