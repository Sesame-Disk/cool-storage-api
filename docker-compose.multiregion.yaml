# Multi-region dev overlay — brings up a second sesamefs instance (EU) so you
# can test simultaneous uploads from two different regions hitting the same
# Cassandra database.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.multiregion.yaml \
#     --env-file .env.example up -d
#
# Ports after startup:
#   localhost:3001  → frontend-usa  (proxies to sesamefs on default port)
#   localhost:3002  → frontend-eu   (proxies to sesamefs-eu on port 4001)
#   localhost:4001  → sesamefs-eu API (direct access for integration tests)
#
# Dev login:
#   http://localhost:3001/accounts/dev-login?as=admin  (USA)
#   http://localhost:3002/accounts/dev-login?as=admin  (EU)
#
# Two-region integration test:
#   SESAMEFS_URL=http://localhost:3000 SESAMEFS_URL_2=http://localhost:4001 \
#     go test -tags integration ./internal/integration/ \
#     -run TestConcurrentTwoRegionUploadsNoLostCommits -v

services:
  sesamefs-eu:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4001:8080"
    env_file:
      - ${ENV_FILE:-.env.example}
    environment:
      - PORT=8080
      - SERVER_URL=http://localhost:3002
      - SERVER_REGION=eu
      - STORAGE_MODE=multi
      - CASSANDRA_HOSTS=${CASSANDRA_HOSTS:-cassandra:9042}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-sesamefs}
      - CASSANDRA_LOCAL_DC=${CASSANDRA_LOCAL_DC:-datacenter1}
      - AUTH_DEV_MODE=${AUTH_DEV_MODE:-true}
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - SHARE_LINK_HMAC_KEY=${SHARE_LINK_HMAC_KEY:-dev-share-link-hmac-key}
      - ONLYOFFICE_ENABLED=${ONLYOFFICE_ENABLED:-true}
      - ONLYOFFICE_API_JS_URL=${ONLYOFFICE_API_JS_URL:-http://localhost:8088/web-apps/apps/api/documents/api.js}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-change-me-to-a-random-string}
      - FRONTEND_URL=http://frontend-eu:80
    depends_on:
      cassandra:
        condition: service_healthy
      cassandra-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend-eu:
    image: cool-storage-api-frontend
    ports:
      - "${FRONTEND_EU_HOST_PORT:-3002}:80"
    volumes:
      - ./configs/nginx-eu.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sesamefs-eu
    restart: unless-stopped
