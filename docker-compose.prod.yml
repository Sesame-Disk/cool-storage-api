# =============================================================================
# SesameFS — Production Docker Compose
# =============================================================================
# Usage:
#   1. cp .env.prod.example .env
#   2. Fill in all values in .env
#   3. Get SSL certs for your public SesameFS hostname
#   4. docker compose -f docker-compose.prod.yml up -d
#
# Optional alternate env file:
#   ENV_FILE=.env.prod docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# All secrets come from .env — never hardcode values here.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # SesameFS API backend
  # ---------------------------------------------------------------------------
  sesamefs:
    image: ${SESAMEFS_IMAGE:?set SESAMEFS_IMAGE in .env}
    expose:
      - "8080"                      # Reachable as sesamefs:8080 on the private deploy network
    networks:
      - internal
    env_file:
      - ${ENV_FILE:-.env}           # All secrets from the selected env file
    environment:
      - STORAGE_MODE=${STORAGE_MODE:-multi}
      - OIDC_ENABLED=${OIDC_ENABLED:-true}
      - OIDC_REDIRECT_URIS=${OIDC_REDIRECT_URIS}
      - ONLYOFFICE_ENABLED=${ONLYOFFICE_ENABLED:-true}
      - ONLYOFFICE_API_JS_URL=${ONLYOFFICE_API_JS_URL}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend:80}
      - BILLING_URL=${BILLING_URL}
      - ACCOUNTS_DELETE_ACCOUNT_URL=${ACCOUNTS_DELETE_ACCOUNT_URL}
      - ACCOUNTS_ORG_USER_MANAGEMENT_URL=${ACCOUNTS_ORG_USER_MANAGEMENT_URL}
      - ACCOUNTS_DISABLE_ORG_USER_WRITES=${ACCOUNTS_DISABLE_ORG_USER_WRITES:-true}
      # Destructive GC remains blocked until X1 acceptance is complete; X2 is closed
      # under the stable-topology operational contract.
      - GC_ENABLED=false

      # Cassandra — defaults work for single-region; override in .env for multi-region
      - CASSANDRA_HOSTS=${CASSANDRA_HOSTS:-cassandra:9042}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-sesamefs}
      - CASSANDRA_LOCAL_DC=${CASSANDRA_LOCAL_DC:-datacenter1}
      # Optional: set CASSANDRA_TIMEOUT in .env to override configs/config.prod.yaml (defaults there to 25s for safer upload/LWT testing)

      # Region — leave empty for single-region; set to na/eu/asia in multi-region
      - SERVER_REGION=${SERVER_REGION:-}

      # Force production mode (overrides any accidental dev values in .env)
      - AUTH_DEV_MODE=false
      - METRICS_ENABLED=true
      - SHARE_LINK_HMAC_KEY=${SHARE_LINK_HMAC_KEY}
    volumes:
      # Mount prod config over the config baked into the Docker image.
      # This config has structural settings; all secrets come from env vars.
      - ./configs/config.prod.yaml:/app/config.yaml:ro
    depends_on:
      cassandra:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Cassandra Database
  # ---------------------------------------------------------------------------
  # Single-region: runs on internal Docker network only (default).
  # Multi-region:  set CASSANDRA_BIND_IP to the private/vRack IP so other
  #                nodes can reach gossip (7000/7001) and CQL (9042) ports.
  #                Ports are NEVER exposed on 0.0.0.0 — only on the bind IP.
  # ---------------------------------------------------------------------------
  cassandra:
    image: cassandra:5.0.9
    expose:
      - "9042"                      # Internal only — sesamefs reaches via 'internal' network
    ports:
      # Multi-region: bind to private IP for inter-node gossip and CQL.
      # Single-region: defaults to 127.0.0.1 (localhost only, not reachable externally).
      - "${CASSANDRA_BIND_IP:-127.0.0.1}:7000:7000"    # Gossip inter-node
      - "${CASSANDRA_BIND_IP:-127.0.0.1}:7001:7001"    # Gossip TLS
      - "${CASSANDRA_BIND_IP:-127.0.0.1}:9042:9042"    # CQL native
    networks:
      - internal
    entrypoint:
      - /bin/bash
      - -ec
    env_file:
      - ${ENV_FILE:-.env}           # Multi-region vars (CASSANDRA_SEEDS, etc.) come from the selected env file
    environment:
      # Always-required settings (with sensible defaults)
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER_NAME}
      - CASSANDRA_DC=${CASSANDRA_DC:-datacenter1}
      - CASSANDRA_RACK=${CASSANDRA_RACK:-rack1}
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=${CASSANDRA_MAX_HEAP_SIZE}
      - HEAP_NEWSIZE=${CASSANDRA_HEAP_NEWSIZE}
      # Multi-region vars (CASSANDRA_SEEDS, CASSANDRA_BROADCAST_ADDRESS,
      # CASSANDRA_RPC_ADDRESS, CASSANDRA_BROADCAST_RPC_ADDRESS) are passed
      # via env_file above. Do NOT set CASSANDRA_LISTEN_ADDRESS (auto-detect).
      # When commented out in .env → not set → Cassandra uses its defaults.
      # When uncommented in .env → passed to container → multi-region works.
    command:
      - |
        sed -ri 's/^authenticator:.*/authenticator: PasswordAuthenticator/' /etc/cassandra/cassandra.yaml
        sed -ri 's/^authorizer:.*/authorizer: CassandraAuthorizer/' /etc/cassandra/cassandra.yaml
        exec docker-entrypoint.sh cassandra -f
    volumes:
      - ${CASSANDRA_DATA_DIR:?set CASSANDRA_DATA_DIR in .env}:/var/lib/cassandra
    healthcheck:
      test:
        - CMD-SHELL
        - cqlsh -u cassandra -p "$${CASSANDRA_SUPERUSER_PASSWORD:-cassandra}" -e "describe keyspaces" || cqlsh -u cassandra -p cassandra -e "describe keyspaces"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Cassandra bootstrap (auth + app role + keyspace)
  # ---------------------------------------------------------------------------
  cassandra-bootstrap:
    image: cassandra:5.0.9
    profiles:
      - bootstrap
    networks:
      - internal
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        set -euo pipefail
        admin_pass="$${CASSANDRA_SUPERUSER_PASSWORD:?set CASSANDRA_SUPERUSER_PASSWORD in .env}"
        app_user="$${CASSANDRA_USERNAME:?set CASSANDRA_USERNAME in .env}"
        app_pass="$${CASSANDRA_PASSWORD:?set CASSANDRA_PASSWORD in .env}"
        keyspace="$${CASSANDRA_KEYSPACE:-sesamefs}"
        storage_mode="$$(printf '%s' "$${STORAGE_MODE:-multi}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
        local_dc="$${CASSANDRA_DC:-$${CASSANDRA_LOCAL_DC:-datacenter1}}"
        replication_class="$${CASSANDRA_REPLICATION_CLASS:-NetworkTopologyStrategy}"
        replication_factor="$${CASSANDRA_REPLICATION_FACTOR:-1}"
        replication_dcs="$${CASSANDRA_REPLICATION_DCS:-$${local_dc}:1}"
        admin_pass_escaped="$${admin_pass//\'/\'\'}"
        app_pass_escaped="$${app_pass//\'/\'\'}"
        attempts=0
        admin_rotated=0

        if [ "$${storage_mode}" = "multi" ] && [ -z "$${CASSANDRA_REPLICATION_DCS:-}" ]; then
          echo "STORAGE_MODE=multi requires CASSANDRA_REPLICATION_DCS to be set explicitly with every datacenter." >&2
          exit 1
        fi

        build_replication_cql() {
          local normalized_class
          normalized_class="$$(printf '%s' "$${replication_class}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          case "$${normalized_class}" in
            simplestrategy)
              echo "Warning: SimpleStrategy is only kept for backward compatibility; prefer NetworkTopologyStrategy even for single-node deployments." >&2
              case "$${replication_factor}" in
                ''|*[!0-9]*) echo "Invalid CASSANDRA_REPLICATION_FACTOR: $${replication_factor}" >&2; exit 1 ;;
              esac
              if [ "$${replication_factor}" -lt 1 ]; then
                echo "CASSANDRA_REPLICATION_FACTOR must be greater than zero" >&2
                exit 1
              fi
              printf "{'class': 'SimpleStrategy', 'replication_factor': %s}" "$${replication_factor}"
              ;;
            networktopologystrategy)
              if [ -z "$${replication_dcs//[[:space:]]/}" ]; then
                echo "CASSANDRA_REPLICATION_DCS is required when CASSANDRA_REPLICATION_CLASS=NetworkTopologyStrategy" >&2
                exit 1
              fi
              local map entry dc rf has_local_dc
              has_local_dc=false
              map="{'class': 'NetworkTopologyStrategy'"
              IFS=',' read -r -a replication_entries <<< "$${replication_dcs}"
              for entry in "$${replication_entries[@]}"; do
                entry="$${entry//[[:space:]]/}"
                [ -n "$${entry}" ] || continue
                if [[ "$${entry}" != *:* ]]; then
                  echo "Invalid CASSANDRA_REPLICATION_DCS entry: $${entry}" >&2
                  exit 1
                fi
                dc="$${entry%%:*}"
                rf="$${entry#*:}"
                if [[ ! "$${dc}" =~ ^[A-Za-z0-9._-]+$ ]]; then
                  echo "Invalid Cassandra datacenter name in CASSANDRA_REPLICATION_DCS: $${dc}" >&2
                  exit 1
                fi
                case "$${rf}" in
                  ''|*[!0-9]*) echo "Invalid replication factor for datacenter $${dc}: $${rf}" >&2; exit 1 ;;
                esac
                if [ "$${rf}" -lt 1 ]; then
                  echo "Replication factor must be greater than zero for datacenter $${dc}" >&2
                  exit 1
                fi
                map="$${map}, '$${dc}': $${rf}"
                if [ -n "$${local_dc}" ] && [ "$${dc}" = "$${local_dc}" ]; then
                  has_local_dc=true
                fi
              done
              if [ "$${map}" = "{'class': 'NetworkTopologyStrategy'" ]; then
                echo "CASSANDRA_REPLICATION_DCS must contain at least one dc:rf pair" >&2
                exit 1
              fi
              if [ -n "$${local_dc}" ] && [ "$${has_local_dc}" = "false" ]; then
                echo "CASSANDRA_REPLICATION_DCS does not include the local datacenter '$${local_dc}'. Add it to CASSANDRA_REPLICATION_DCS or fix CASSANDRA_DC/CASSANDRA_LOCAL_DC." >&2
                exit 1
              fi
              printf "%s}" "$${map}"
              ;;
            *)
              echo "Invalid CASSANDRA_REPLICATION_CLASS: $${replication_class}" >&2
              exit 1
              ;;
          esac
        }

        replication_cql="$$(build_replication_cql)"

        case "$${keyspace}" in
          [A-Za-z][A-Za-z0-9_]*) ;;
          *) echo "Invalid Cassandra keyspace identifier: $${keyspace}" >&2; exit 1 ;;
        esac
        case "$${app_user}" in
          [A-Za-z][A-Za-z0-9_]*) ;;
          *) echo "Invalid Cassandra role identifier: $${app_user}" >&2; exit 1 ;;
        esac

        until cqlsh cassandra -u cassandra -p "$${admin_pass}" -e "DESCRIBE KEYSPACES" >/dev/null 2>&1; do
          if cqlsh cassandra -u cassandra -p cassandra -e "DESCRIBE KEYSPACES" >/dev/null 2>&1; then
            if [ "$${admin_rotated}" -eq 0 ]; then
              cqlsh cassandra -u cassandra -p cassandra -e "ALTER ROLE cassandra WITH PASSWORD = '$${admin_pass_escaped}' AND LOGIN = true;"
              admin_rotated=1
            fi

            echo "Waiting for Cassandra superuser password rotation to settle..." >&2
            sleep 5
            continue
          fi

          attempts=$$((attempts + 1))
          if [ "$${attempts}" -ge 30 ]; then
            echo "Timed out waiting for Cassandra superuser bootstrap" >&2
            exit 1
          fi

          echo "Waiting for Cassandra auth tables to finish initializing..." >&2
          sleep 2
        done

        cqlsh cassandra -u cassandra -p "$${admin_pass}" <<EOF
        CREATE KEYSPACE IF NOT EXISTS $${keyspace} WITH replication = $${replication_cql};
        ALTER KEYSPACE $${keyspace} WITH replication = $${replication_cql};
        ALTER KEYSPACE system_auth WITH replication = $${replication_cql};
        CREATE ROLE IF NOT EXISTS $${app_user} WITH PASSWORD = '$${app_pass_escaped}' AND LOGIN = true;
        GRANT ALL PERMISSIONS ON KEYSPACE $${keyspace} TO $${app_user};
        EOF

        sleep 5
        cqlsh cassandra -u cassandra -p "$${admin_pass}" -e "ALTER ROLE $${app_user} WITH PASSWORD = '$${app_pass_escaped}' AND LOGIN = true;"
    restart: "no"

  # ---------------------------------------------------------------------------
  # Desktop Frontend (React SPA — served by nginx:alpine)
  # ---------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE in .env}
    expose:
      - "80"                        # Reachable internally as frontend:80 and externally via the regional alias on sfs-net
    networks:
      internal: {}
      sfs-net:
        aliases:
          - "sesamefs-frontend-${DEPLOY_ID:?set DEPLOY_ID in .env}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Mobile Frontend (Astro PWA)
  # ---------------------------------------------------------------------------
  # mobile-frontend:
  #   build:
  #     context: ./mobile-frontend
  #     dockerfile: Dockerfile
  #   expose:
  #     - "80"
  #   networks:
  #     - sfs-net
  #   depends_on:
  #     - sesamefs
  #   restart: unless-stopped
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "100m"
  #       max-file: "3"

networks:
  sfs-net:
    external: true        # Create once: docker network create sfs-net
  internal:
    # Private per-deploy network for frontend <-> sesamefs and for the local
    # Cassandra node. Not marked 'internal: true' because
    # Cassandra still needs outbound routing for multi-region gossip.
