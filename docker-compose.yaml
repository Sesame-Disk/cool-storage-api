        condition: service_healthy
      cassandra-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
      - test

  sesamefs-node-3:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - PORT=${PORT:-8080}
      - SERVER_URL=${SERVER_URL}
      - BILLING_URL=${BILLING_URL:-https://t-accounts.sesamedisk.com/billing/}
      - ACCOUNTS_DELETE_ACCOUNT_URL=${ACCOUNTS_DELETE_ACCOUNT_URL:-https://t-accounts.sesamedisk.com/accounts/delete/}
      - ACCOUNTS_ORG_USER_MANAGEMENT_URL=${ACCOUNTS_ORG_USER_MANAGEMENT_URL:-https://t-accounts.sesamedisk.com/accounts/sesamefs/dashboard/}
      - ACCOUNTS_DISABLE_ORG_USER_WRITES=${ACCOUNTS_DISABLE_ORG_USER_WRITES:-false}
      - CASSANDRA_HOSTS=${CASSANDRA_HOSTS:-cassandra:9042}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-sesamefs}
      - CASSANDRA_LOCAL_DC=${CASSANDRA_LOCAL_DC:-datacenter1}
      - AUTH_DEV_MODE=${AUTH_DEV_MODE:-true}
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URIS=${OIDC_REDIRECT_URIS}
      - OIDC_SESSION_TTL=${OIDC_SESSION_TTL:-24h}
      - OIDC_API_TOKEN_TTL=${OIDC_API_TOKEN_TTL:-4320h}
      - OIDC_AUTO_PROVISION=${OIDC_AUTO_PROVISION:-false}
      - OIDC_DEFAULT_ROLE=${OIDC_DEFAULT_ROLE:-user}
      - OIDC_REQUIRE_PKCE=${OIDC_REQUIRE_PKCE:-true}
      - OIDC_JWT_SIGNING_KEY=${OIDC_JWT_SIGNING_KEY}
      - OIDC_ROLES_CLAIM=${OIDC_ROLES_CLAIM}
      - OIDC_ORG_CLAIM=${OIDC_ORG_CLAIM}
      - OIDC_DEFAULT_ORG_ID=${OIDC_DEFAULT_ORG_ID}
      - OIDC_PLATFORM_ORG_ID=${OIDC_PLATFORM_ORG_ID}
      - OIDC_PLATFORM_ORG_CLAIM_VALUE=${OIDC_PLATFORM_ORG_CLAIM_VALUE}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-sesamefs-blocks}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - SHARE_LINK_HMAC_KEY=${SHARE_LINK_HMAC_KEY:-dev-share-link-hmac-key}
      - FIRST_SUPERADMIN_EMAIL=${FIRST_SUPERADMIN_EMAIL}
      - ONLYOFFICE_ENABLED=${ONLYOFFICE_ENABLED:-true}
      - ONLYOFFICE_API_JS_URL=${ONLYOFFICE_API_JS_URL:-http://localhost:8088/web-apps/apps/api/documents/api.js}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-change-me-to-a-random-string}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend:80}
      - GC_ENABLED=false
    depends_on:
      cassandra:
        condition: service_healthy
      cassandra-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
      - test

  cassandra:
    image: cassandra:5.0
    ports:
      - "${CASSANDRA_HOST_PORT:-9042}:9042"
    env_file:
      - ${ENV_FILE:-.env}
    entrypoint:
      - /bin/bash
      - -ec
    environment:
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER_NAME:-sesamefs}
      - CASSANDRA_DC=${CASSANDRA_DC:-datacenter1}
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=${CASSANDRA_MAX_HEAP_SIZE:-512M}
      - HEAP_NEWSIZE=${CASSANDRA_HEAP_NEWSIZE:-100M}
    command:
      - |
        sed -ri 's/^authenticator:.*/authenticator: PasswordAuthenticator/' /etc/cassandra/cassandra.yaml
        sed -ri 's/^authorizer:.*/authorizer: CassandraAuthorizer/' /etc/cassandra/cassandra.yaml
        exec docker-entrypoint.sh cassandra -f
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test:
        - CMD-SHELL
        - cqlsh -u cassandra -p "$${CASSANDRA_SUPERUSER_PASSWORD:-cassandra}" -e "describe keyspaces" || cqlsh -u cassandra -p cassandra -e "describe keyspaces"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  cassandra-bootstrap:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        set -euo pipefail
        admin_pass="$${CASSANDRA_SUPERUSER_PASSWORD:?set CASSANDRA_SUPERUSER_PASSWORD in .env}"
        app_user="$${CASSANDRA_USERNAME:?set CASSANDRA_USERNAME in .env}"
        app_pass="$${CASSANDRA_PASSWORD:?set CASSANDRA_PASSWORD in .env}"
        keyspace="$${CASSANDRA_KEYSPACE:-sesamefs}"
        storage_mode="$$(printf '%s' "$${STORAGE_MODE:-single}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
        local_dc="$${CASSANDRA_DC:-$${CASSANDRA_LOCAL_DC:-datacenter1}}"
        replication_class="$${CASSANDRA_REPLICATION_CLASS:-NetworkTopologyStrategy}"
        replication_factor="$${CASSANDRA_REPLICATION_FACTOR:-1}"
        replication_dcs="$${CASSANDRA_REPLICATION_DCS:-$${local_dc}:1}"
        admin_pass_escaped="$${admin_pass//\'/\'\'}"
        app_pass_escaped="$${app_pass//\'/\'\'}"
        attempts=0
        admin_rotated=0

        if [ "$${storage_mode}" = "multi" ] && [ -z "$${CASSANDRA_REPLICATION_DCS:-}" ]; then
          echo "STORAGE_MODE=multi requires CASSANDRA_REPLICATION_DCS to be set explicitly with every datacenter." >&2
          exit 1
        fi

        build_replication_cql() {
          local normalized_class
          normalized_class="$$(printf '%s' "$${replication_class}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          case "$${normalized_class}" in
            simplestrategy)
              echo "Warning: SimpleStrategy is only kept for backward compatibility; prefer NetworkTopologyStrategy even for single-node deployments." >&2
              case "$${replication_factor}" in
                ''|*[!0-9]*) echo "Invalid CASSANDRA_REPLICATION_FACTOR: $${replication_factor}" >&2; exit 1 ;;
              esac
              if [ "$${replication_factor}" -lt 1 ]; then
                echo "CASSANDRA_REPLICATION_FACTOR must be greater than zero" >&2
                exit 1
              fi
              printf "{'class': 'SimpleStrategy', 'replication_factor': %s}" "$${replication_factor}"
              ;;
            networktopologystrategy)
              if [ -z "$${replication_dcs//[[:space:]]/}" ]; then
                echo "CASSANDRA_REPLICATION_DCS is required when CASSANDRA_REPLICATION_CLASS=NetworkTopologyStrategy" >&2
                exit 1
              fi
              local map entry dc rf has_local_dc
              has_local_dc=false
              map="{'class': 'NetworkTopologyStrategy'"
              IFS=',' read -r -a replication_entries <<< "$${replication_dcs}"
              for entry in "$${replication_entries[@]}"; do
                entry="$${entry//[[:space:]]/}"
                [ -n "$${entry}" ] || continue
                if [[ "$${entry}" != *:* ]]; then
                  echo "Invalid CASSANDRA_REPLICATION_DCS entry: $${entry}" >&2
                  exit 1
                fi
                dc="$${entry%%:*}"
                rf="$${entry#*:}"
                if [[ ! "$${dc}" =~ ^[A-Za-z0-9._-]+$ ]]; then
                  echo "Invalid Cassandra datacenter name in CASSANDRA_REPLICATION_DCS: $${dc}" >&2
                  exit 1
                fi
                case "$${rf}" in
                  ''|*[!0-9]*) echo "Invalid replication factor for datacenter $${dc}: $${rf}" >&2; exit 1 ;;
                esac
                if [ "$${rf}" -lt 1 ]; then
                  echo "Replication factor must be greater than zero for datacenter $${dc}" >&2
                  exit 1
                fi
                map="$${map}, '$${dc}': $${rf}"
                if [ -n "$${local_dc}" ] && [ "$${dc}" = "$${local_dc}" ]; then
                  has_local_dc=true
                fi
              done
              if [ "$${map}" = "{'class': 'NetworkTopologyStrategy'" ]; then
                echo "CASSANDRA_REPLICATION_DCS must contain at least one dc:rf pair" >&2
                exit 1
              fi
              if [ -n "$${local_dc}" ] && [ "$${has_local_dc}" = "false" ]; then
                echo "CASSANDRA_REPLICATION_DCS does not include the local datacenter '$${local_dc}'. Add it to CASSANDRA_REPLICATION_DCS or fix CASSANDRA_DC/CASSANDRA_LOCAL_DC." >&2
                exit 1
              fi
              printf "%s}" "$${map}"
              ;;
            *)
              echo "Invalid CASSANDRA_REPLICATION_CLASS: $${replication_class}" >&2
              exit 1
              ;;
          esac
        }

        replication_cql="$$(build_replication_cql)"

        case "$${keyspace}" in
          [A-Za-z][A-Za-z0-9_]*) ;;
          *) echo "Invalid Cassandra keyspace identifier: $${keyspace}" >&2; exit 1 ;;
        esac
        case "$${app_user}" in
          [A-Za-z][A-Za-z0-9_]*) ;;
          *) echo "Invalid Cassandra role identifier: $${app_user}" >&2; exit 1 ;;
        esac

        until cqlsh cassandra -u cassandra -p "$${admin_pass}" -e "DESCRIBE KEYSPACES" >/dev/null 2>&1; do
          if cqlsh cassandra -u cassandra -p cassandra -e "DESCRIBE KEYSPACES" >/dev/null 2>&1; then
            if [ "$${admin_rotated}" -eq 0 ]; then
              cqlsh cassandra -u cassandra -p cassandra -e "ALTER ROLE cassandra WITH PASSWORD = '$${admin_pass_escaped}' AND LOGIN = true;"
              admin_rotated=1
            fi

            echo "Waiting for Cassandra superuser password rotation to settle..." >&2
            sleep 5
            continue
          fi

          attempts=$$((attempts + 1))
          if [ "$${attempts}" -ge 30 ]; then
            echo "Timed out waiting for Cassandra superuser bootstrap" >&2
            exit 1
          fi

          echo "Waiting for Cassandra auth tables to finish initializing..." >&2
          sleep 2
        done

        cqlsh cassandra -u cassandra -p "$${admin_pass}" <<EOF
        CREATE KEYSPACE IF NOT EXISTS $${keyspace} WITH replication = $${replication_cql};
        ALTER KEYSPACE $${keyspace} WITH replication = $${replication_cql};
        ALTER KEYSPACE system_auth WITH replication = $${replication_cql};
        CREATE ROLE IF NOT EXISTS $${app_user} WITH PASSWORD = '$${app_pass_escaped}' AND LOGIN = true;
        GRANT ALL PERMISSIONS ON KEYSPACE $${keyspace} TO $${app_user};
        EOF

        sleep 5
        cqlsh cassandra -u cassandra -p "$${admin_pass}" -e "ALTER ROLE $${app_user} WITH PASSWORD = '$${app_pass_escaped}' AND LOGIN = true;"
    env_file:
      - ${ENV_FILE:-.env}
    restart: "no"

  # Elasticsearch REMOVED - Using Cassandra SASI for search instead
  # Saves 2GB RAM, search via /api/v2.1/search/ uses Cassandra indexes

  # MinIO for local S3-compatible storage (development)
  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"      # S3 API
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Create buckets for multi-region simulation
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      echo 'Creating buckets for multi-region simulation...';
      mc mb myminio/sesamefs-blocks --ignore-existing;
      mc mb myminio/sesamefs-usa --ignore-existing;
      mc mb myminio/sesamefs-eu --ignore-existing;
      mc mb myminio/sesamefs-china --ignore-existing;
      mc mb myminio/sesamefs-archive --ignore-existing;
      mc anonymous set download myminio/sesamefs-blocks;
      mc anonymous set download myminio/sesamefs-usa;
      mc anonymous set download myminio/sesamefs-eu;
      mc anonymous set download myminio/sesamefs-china;
      echo 'Buckets created:';
      mc ls myminio;
      exit 0;
      "

  # OnlyOffice Document Server for document editing
  onlyoffice:
    image: onlyoffice/documentserver:latest
    ports:
      - "${ONLYOFFICE_HOST_PORT:-8088}:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-change-me-to-a-random-string}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  mobile-frontend:
    build:
      context: ./mobile-frontend
      dockerfile: Dockerfile
    ports:
      - "${MOBILE_FRONTEND_HOST_PORT:-5173}:80"
    environment:
      - API_URL=${API_URL:-http://sesamefs:8080}
    depends_on:
      - sesamefs
    restart: unless-stopped

  gotest:
    build:
      context: .
      dockerfile: Dockerfile.gotest
    command: ["go", "test", "./...", "-short", "-cover"]
    profiles:
      - test

  go-integration-test:
    build:
      context: .
      dockerfile: Dockerfile.gotest
    env_file:
      - ${ENV_FILE:-.env}
    command:
      - /bin/sh
      - -c
      - ./scripts/wait-for-http.sh http://sesamefs:8080/health sesamefs; ./scripts/wait-for-http.sh http://sesamefs-node-2:8080/health sesamefs-node-2; ./scripts/wait-for-http.sh http://sesamefs-node-3:8080/health sesamefs-node-3; go test -tags integration -v -count=1 -timeout 10m ./internal/integration/...
    environment:
      - SESAMEFS_URL=http://sesamefs:8080
      - SESAMEFS_URL_2=http://sesamefs-node-2:8080
      - SESAMEFS_URL_3=http://sesamefs-node-3:8080
    depends_on:
      - sesamefs
      - sesamefs-node-2
      - sesamefs-node-3
    profiles:
      - test

  go-all-test:
    build:
      context: .
      dockerfile: Dockerfile.gotest
    env_file:
      - ${ENV_FILE:-.env}
    command:
      - /bin/sh
      - -c
      - go test ./... -short -cover && ./scripts/wait-for-http.sh http://sesamefs:8080/health sesamefs && ./scripts/wait-for-http.sh http://sesamefs-node-2:8080/health sesamefs-node-2 && ./scripts/wait-for-http.sh http://sesamefs-node-3:8080/health sesamefs-node-3 && go test -tags integration -v -count=1 -timeout 10m ./internal/integration/... && ./scripts/test.sh api && ./scripts/test.sh oidc
    environment:
      - SESAMEFS_URL=http://sesamefs:8080
      - SESAMEFS_URL_2=http://sesamefs-node-2:8080
      - SESAMEFS_URL_3=http://sesamefs-node-3:8080
      - SESAMEFS_TEST_IN_CONTAINER=1
      - SESAMEFS_CLEAN_TEST_REPOS=1
      - SESAMEFS_FAIL_FAST=1
    depends_on:
      - sesamefs
      - sesamefs-node-2
      - sesamefs-node-3
    profiles:
      - test

  api-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    command:
      - ./scripts/wait-for-http.sh http://sesamefs:8080/health sesamefs; ./scripts/test.sh api
    environment:
      - SESAMEFS_URL=http://sesamefs:8080
      - SESAMEFS_TEST_IN_CONTAINER=1
      - SESAMEFS_CLEAN_TEST_REPOS=1
    depends_on:
      - sesamefs
    profiles:
      - test

  oidc-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    command:
      - ./scripts/wait-for-http.sh http://sesamefs:8080/health sesamefs; ./scripts/test.sh oidc
    environment:
      - SESAMEFS_URL=http://sesamefs:8080
      - SESAMEFS_TEST_IN_CONTAINER=1
    depends_on:
      - sesamefs
    profiles:
      - test

  frontend-test:
    build:
      context: .
      dockerfile: Dockerfile.frontendtest
    profiles:
      - test

  mobile-test:
    build:
      context: .
      dockerfile: Dockerfile.mobiletest
    command:
      - /bin/sh
      - -c
      - >
        ./scripts/wait-for-http.sh "${DESKTOP_BASE_URL:-http://frontend}" frontend;
        npm run check && npm run test:smoke
    environment:
      - DESKTOP_BASE_URL=http://frontend
    depends_on:
      - frontend
    profiles:
      - test

  # Desktop frontend Playwright e2e (mobile + tablet + desktop viewports)
  frontend-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.playwright
    environment:
      - DESKTOP_BASE_URL=http://frontend
      - CI=true
    depends_on:
      - frontend
    profiles:
      - test

  # Desktop Frontend (React SPA — nginx:alpine)
  # Access at http://localhost:3000
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - sesamefs
    restart: unless-stopped

  # Seafile CLI for sync testing
  seafile-cli:
    build:
      context: ./docker/seafile-cli
      dockerfile: Dockerfile
    environment:
      - SEAF_SERVER_URL=${SEAF_CLI_SERVER_URL:-http://sesamefs:8080}
      - SEAF_USERNAME=${SEAF_CLI_USERNAME:-00000000-0000-0000-0000-000000000001}
      - SEAF_PASSWORD=${SEAF_CLI_PASSWORD:-dev-token-123}
    volumes:
      - seafile_cli_data:/seafile-data
      - seafile_cli_config:/home/seafuser/.ccnet
    depends_on:
      - sesamefs
    restart: unless-stopped
    profiles:
      - debug
    # Keep container running for interactive testing
    # Usage: docker compose --profile debug up seafile-cli
    # Then:  docker exec -it cool-storage-api-seafile-cli-1 seaf-test.sh help

  # Seafile CLI DEBUG container for protocol reverse engineering
  # Points to REAL Seafile server for protocol capture
  # IMPORTANT: Set SEAF_DEBUG_* variables in .env — never hardcode credentials here
  seafile-cli-debug:
    build:
      context: ./docker/seafile-cli-debug
      dockerfile: Dockerfile
    environment:
      - SEAF_SERVER_URL=${SEAF_DEBUG_SERVER_URL:-https://your-seafile-server.com}
      - SEAF_USERNAME=${SEAF_DEBUG_USERNAME:-your-email@example.com}
      - SEAF_PASSWORD=${SEAF_DEBUG_PASSWORD:-your-password}
    volumes:
      - seafile_debug_data:/seafile-data
      - seafile_debug_config:/home/seafuser/.ccnet
      - seafile_debug_captures:/captures
      - seafile_debug_mitmproxy:/mitmproxy
    restart: "no"
    profiles:
      - debug
    # Usage: docker compose --profile debug up seafile-cli-debug
    # Then:  docker exec -it cool-storage-api-seafile-cli-debug-1 seaf-debug.sh capture-all

volumes:
  cassandra_data:
  minio_data:
  onlyoffice_data:
  onlyoffice_logs:
  seafile_cli_data:
  seafile_cli_config:
  seafile_debug_data:
  seafile_debug_config:
  seafile_debug_captures:
  seafile_debug_mitmproxy:
