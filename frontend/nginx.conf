map "$arg_raw:$arg_dl" $share_link_passthrough {
    default 0;
    "1:" 1;
    ":1" 1;
    "1:1" 1;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $scheme;
    ~.+ $http_x_forwarded_proto;
}

# In production, the central nginx is the authority that resolves the real
# client IP before proxying to this internal frontend nginx. Preserve that
# canonicalized address when forwarding to Go. This assumes the frontend nginx
# is only reachable from trusted internal paths. If this nginx is reached
# directly (for example in local dev), fall back to the socket peer IP.
map $http_x_real_ip $frontend_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_for $frontend_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend service through Docker DNS so frontend nginx does
    # not need a restart when the sesamefs container gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $sesamefs_upstream http://sesamefs:8080;

    # Performance: efficient static file serving
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Large file uploads — must be at server level so it applies to all proxy locations
    client_max_body_size 100G;

    # Proxy timeouts for large file transfers (uploads, downloads, zip operations)
    # Applied at server level so every proxy_pass inherits these without repetition
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 30s;

    # Gzip compression for SPA assets
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Custom error pages (branded). See frontend/public/{404,500}.html.
    # These are served as static files from /usr/share/nginx/html and are
    # marked `internal` so they cannot be requested directly as URLs.
    # `proxy_intercept_errors` is intentionally NOT enabled at server level —
    # API/proxy locations must keep returning the backend's JSON errors.
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    location = /404.html { internal; }
    location = /500.html { internal; }

    location = /sys {
        return 301 /sys/;
    }

    location = /file-preview {
        return 301 /file-preview/;
    }

    location = /file-error {
        return 301 /file-error/;
    }

    location = /org {
        return 301 /org/;
    }

    location /file-preview/ {
        try_files /filepreview.html =404;
    }

    location /file-error/ {
        try_files /errorpage.html =404;
    }

    # Admin panel SPA - /sys/* routes serve sysadmin.html
    location /sys/ {
        try_files $uri $uri/ /sysadmin.html;
    }

    # Org admin panel SPA - /org/* routes serve orgadmin.html
    location /org/ {
        try_files $uri $uri/ /orgadmin.html;
    }

    # Seafile desktop client / SeaDrive autodetection: GET /notification/ping tells
    # the client whether a notification (WebSocket) server is running — it decides
    # this purely from the HTTP status code, ignoring the body. We don't run one.
    # Without this block the request falls through to the SPA catch-all below,
    # which returns 200 + index.html, so the client wrongly believes notifications
    # are enabled and starts polling /seafhttp/repo/:id/jwt-token (which then 404s,
    # same as it would against a stock Seafile server with notifications disabled —
    # see docs/KNOWN_ISSUES.md ISSUE-SD-02). Returning 404 here directly lets the
    # client correctly detect "disabled" up front and fall back to plain polling.
    location = /notification {
        return 404;
    }

    location ^~ /notification/ {
        return 404;
    }

    # Main app SPA routing. Unknown client routes are handled by the React
    # router's default page instead of being enumerated here in nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /favicon.png =404;
    }

    # File serving proxy - only backend file-view endpoints should bypass the SPA.
    # Repo pages like /repo/:id/trash/, /repo/history/:id/, /repo/:id/snapshot/
    # and /repo/file_revisions/:id/ must fall through to index.html.
    location ~ ^/repo/[^/]+/raw/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering         off;
        proxy_request_buffering off;
        gzip                    off;
    }

    location ~ ^/repo/[^/]+/history/(download|view|raw)/?$ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering         off;
        proxy_request_buffering off;
        gzip                    off;
    }

    # Static frontend assets, including locale JSON files copied from editor packages.
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static assets caching outside /static
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 418 = @share_link_backend;

    location @share_link_backend {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering         off;
        proxy_request_buffering off;
        gzip                    off;
        # Replace backend 5xx errors with our branded 500 page for this
        # user-facing HTML location. 404s from backend already flow through
        # the backend template and don't need interception.
        proxy_intercept_errors on;
    }

    location ~ ^/d/[^/]+(?:/files/?)?$ {
        if ($share_link_passthrough) {
            return 418;
        }
        try_files /sharelink.html =404;
    }

    location /d/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering         off;
        proxy_request_buffering off;
        gzip                    off;
    }

    location ~ ^/u/d/[^/]+/?$ {
        try_files /uploadlink.html =404;
    }

    location /u/d/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering         off;
        proxy_request_buffering off;
    }

    # Org-scoped SAML endpoints belong to the backend, not the org admin SPA shell
    location /org/custom/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # File viewer proxy — may stream previews and OnlyOffice content, do not buffer
    location ^~ /lib/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering         off;
        proxy_request_buffering off;
        # User-facing HTML viewer: upgrade backend 5xx to branded 500 page.
        proxy_intercept_errors on;
    }

    # OnlyOffice callback proxy
    location /onlyoffice/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering         off;
        proxy_request_buffering off;
    }

    # Office document conversion proxy
    location /office-convert/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
    }

    # API proxy — forwards JSON API traffic to backend
    location /api2/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /api/v2/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # Public share bootstrap responses can contain inline file content. Keep
    # browser-to-backend backpressure visible to the Go idle-write lifetime.
    location ~ ^/api/v2\.1/share-links/[^/]+/(?:files/)?bootstrap/?$ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_buffering         off;
        proxy_request_buffering off;
        gzip                    off;
    }

    location /api/v2.1/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # Seafile HTTP file transfer — large files, streaming only
    location ^~ /seafhttp/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        # client_max_body_size inherited from server block
        proxy_buffering         off;
        proxy_request_buffering off;
        gzip                    off;
    }

    # Accounts endpoints (logout, etc.) - proxy to backend
    location /accounts/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # Language selector - persists locale cookie and redirects back (backend).
    # Exact-match the slashless form too: "location /i18n/" alone would not match
    # "/i18n?lang=.." (it would fall through to the SPA catch-all). The backend
    # registers both /i18n and /i18n/. "= /i18n" avoids capturing "/i18nfoo".
    location = /i18n {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /i18n/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # OIDC and desktop-client auth - proxy to backend
    location /oauth/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /saml2/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /client-login {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /client-sso {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /smart-link/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /billing {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /share/ {
        proxy_pass $sesamefs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $frontend_client_ip;
        proxy_set_header X-Forwarded-For $frontend_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
