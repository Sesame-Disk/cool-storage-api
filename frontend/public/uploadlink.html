<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>SesameFS</title>
  <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png">
  <link rel="stylesheet" href="%PUBLIC_URL%/static/css/seahub.css">
  <link rel="stylesheet" href="%PUBLIC_URL%/static/css/sesamefs-pages.css">
  <link rel="stylesheet" href="%PUBLIC_URL%/static/css/sf_font2/seafile-font2.css">
  <link rel="stylesheet" href="%PUBLIC_URL%/static/css/sf_font3/iconfont.css">
  <link rel="stylesheet" href="%PUBLIC_URL%/static/fontawesome/css/fontawesome-all.min.css">
</head>
<body>
  <div id="wrapper"></div>
  <div id="modal-wrapper"></div>
  <script>
    window.gettext = function(s) { return s; };
    window.ngettext = function(s, p, n) { return n === 1 ? s : p; };
    window.pgettext = function(c, s) { return s; };
    window.interpolate = function(fmt, obj, named) {
      if (named) {
        return fmt.replace(/%\((\w+)\)s/g, function(m, k) { return obj[k] !== undefined ? obj[k] : m; });
      }
      return fmt.replace(/%s/g, function() { return obj.shift(); });
    };
    window.app = window.app || {};
    window.app.config = {
      serviceURL: '',
      mediaUrl: '/static/',
      siteRoot: '/',
      staticUrl: '/static/',
      logoPath: 'img/logo.png',
      logoWidth: 128,
      logoHeight: 40,
      siteTitle: 'SesameFS',
      fileServerRoot: '/seafhttp/',
      useGoFileserver: true,
      lang: 'en'
    };
    window.app.pageOptions = window.app.pageOptions || { name: '', username: '', contactEmail: '' };
    window.uploadLink = {};
  </script>
</body>
</html>
