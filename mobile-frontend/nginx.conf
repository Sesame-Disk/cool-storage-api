server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  # Deliberately short for ordinary responses. The download-admission locations
  # raise it above every deadline validation accepts; see
  # config.MinNginxSendTimeout.
  send_timeout 60s;

  location = /favicon.ico {
    access_log off;
    log_not_found off;
    try_files /favicon.png =404;
  }

  # SPA fallback - serve index.html for all non-file routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API proxy to sesamefs backend
  location /api2/ {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v2.1/ {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # File server proxy (large file uploads/downloads)
  location /seafhttp/ {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
    client_max_body_size 10G;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    # Download admission owns the lifetime of these transfers, so the proxy
    # must not fire first. Floors derive from the validation ceilings; see
    # config.MinNginxSendTimeout and MinNginxProxyReadTimeout.
    send_timeout            2700s;
    proxy_read_timeout      4800s;
  }

  # Media proxy (avatars, thumbnails) - ^~ prevents regex location from overriding
  location ^~ /media/ {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
  }

  # Auth/account endpoints
  location /accounts/ {
    proxy_pass http://sesamefs:8080;
  }

  # Download-admission byte producers: share raw, authenticated raw/history and
  # the share bootstrap's inline content. They were reaching the backend through
  # the generic repo location below, inheriting the short server default, so the
  # proxy — not the application — decided when a stalled client ended. Regex
  # locations are tried in order, so this must stay above that one. Floors derive
  # from the validation ceilings; see config.MinNginxSendTimeout and
  # MinNginxProxyReadTimeout.
  location ~ ^/(d/|repo/[^/]+/(raw|history)/|api/v2\.1/share-links/[^/]+/(files/)?bootstrap) {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The idle-write guard only sees a slow client while the proxy streams
    # rather than absorbing the response.
    proxy_buffering         off;
    gzip                    off;
    send_timeout            2700s;
    proxy_read_timeout      4800s;
  }

  # Repo serving (share links, downloads)
  location ~ ^/(d|u/d|repo|lib)/ {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
  }

  # Static assets caching
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker - no cache
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
}
