server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Needed so the optional sesameauth upstream can be
  # resolved lazily at request time (via a variable in proxy_pass) instead of
  # at config-parse time — otherwise nginx refuses to start whenever the
  # local-auth service isn't running (OIDC-only / dev-token-only deployments,
  # or simply a slower-starting sesameauth), crash-looping the whole PWA.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /favicon.ico {
    access_log off;
    log_not_found off;
    try_files /favicon.png =404;
  }

  # SPA fallback - serve index.html for all non-file routes
  location / {
    # Dynamic routes (/libraries/:id/..., /groups/:id, .../trash) have no prebuilt
    # HTML in this static Astro build. Fall back to the app shell (404.astro →
    # AppRouter), which renders the right island from the URL client-side.
    try_files $uri $uri/ /404.html;
  }

  # API proxy to sesamefs backend
  location /api2/ {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Local-auth endpoints are served by the optional sesameauth service, not the
  # storage service. These prefixes are longer/more-specific than /api/v2.1/ and
  # /api/v2/, so nginx routes them here first; everything else under /api/...
  # still goes to the storage backend. Mirrors frontend/nginx.conf.
  # $sesameauth is a plain variable (not an upstream{} name) so nginx defers DNS
  # resolution to request time using the resolver above. proxy_pass carries
  # $request_uri to preserve the exact path the client sent (matching the old
  # URI-less proxy_pass behaviour); sesameauth serves these paths verbatim.
  location ^~ /api/v2.1/auth/local/ {
    set $sesameauth sesameauth:8080;
    proxy_pass http://$sesameauth$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/v2.1/auth/methods {
    set $sesameauth sesameauth:8080;
    proxy_pass http://$sesameauth$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/v2/auth/local/ {
    set $sesameauth sesameauth:8080;
    proxy_pass http://$sesameauth$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/v2/auth/methods {
    set $sesameauth sesameauth:8080;
    proxy_pass http://$sesameauth$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v2.1/ {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Block-upload endpoints (large files) live under /api/v2/ (not /api/v2.1/).
  # The /api/v2/auth/* locations above are more specific and still win.
  location /api/v2/ {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10G;
    proxy_request_buffering off;
  }

  # File server proxy (large file uploads/downloads)
  location /seafhttp/ {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
    client_max_body_size 10G;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
  }

  # Media proxy (avatars, thumbnails) - ^~ prevents regex location from overriding
  location ^~ /media/ {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
  }

  # Auth/account endpoints
  location /accounts/ {
    proxy_pass http://sesamefs:8080;
  }

  # Repo serving (share links, downloads)
  location ~ ^/(d|u/d|repo|lib)/ {
    proxy_pass http://sesamefs:8080;
    proxy_set_header Host $host;
  }

  # Static assets caching
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker - no cache
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
}
